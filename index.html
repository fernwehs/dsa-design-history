:root{
  --bg:#ffffff; --ink:#1a1a1a; --ink-2:#5c5c5a; --ink-3:#8f8f8c; --line:#e3e3df; --panel:#f4f4f1; --box:#F2F2F6;
  --c0:#2a50cc; --c1:#56636d; --c2:#2e6b4f; --c3:#9a7319; --c4:#9b3a22; --c5:#cf2a1e; --c6:#1c3fae;
  --c7:#a67c00; --c8:#19706b; --c9:#d35400; --c10:#d1337f; --c11:#5b45d6; --c12:#4a4a4a;
  --c:var(--c0);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151515; --ink:#efefec; --ink-2:#b4b4b0; --ink-3:#7d7d7a; --line:#2d2d2b; --panel:#1f1f1e; --box:#202024;
    --c0:#7f9bff; --c1:#9eabb4; --c2:#74b896; --c3:#d9b25c; --c4:#e08a72; --c5:#ff7466; --c6:#8aa4ff;
    --c7:#f0c93c; --c8:#63bdb6; --c9:#ff9a4d; --c10:#ff85bf; --c11:#a897ff; --c12:#b8b8b4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151515; --ink:#efefec; --ink-2:#b4b4b0; --ink-3:#7d7d7a; --line:#2d2d2b; --panel:#1f1f1e; --box:#202024;
  --c0:#7f9bff; --c1:#9eabb4; --c2:#74b896; --c3:#d9b25c; --c4:#e08a72; --c5:#ff7466; --c6:#8aa4ff;
  --c7:#f0c93c; --c8:#63bdb6; --c9:#ff9a4d; --c10:#ff85bf; --c11:#a897ff; --c12:#b8b8b4;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;font-size:17px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
/* 리퀀드 글래스 토큰: 간지 위(어두운 배경)와 본문 위(밝은 배경)에서 다르게 */
body{--glass-bg:rgba(255,255,255,.12);--glass-bg-hover:rgba(255,255,255,.2);--glass-fg:#ffffff;--glass-hi:rgba(255,255,255,.5);--glass-rim:rgba(255,255,255,.8);--glass-rim2:rgba(255,255,255,.3);--glass-shadow:rgba(0,0,0,.28)}
body.inbody,.toc-lock body{--glass-bg:rgba(255,255,255,.5);--glass-bg-hover:rgba(255,255,255,.72);--glass-fg:#1a1a1a;--glass-hi:rgba(255,255,255,.95);--glass-rim:rgba(255,255,255,1);--glass-rim2:rgba(0,0,0,.1);--glass-shadow:rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.inbody,:root:not([data-theme="light"]).toc-lock body{--glass-bg:rgba(44,44,48,.45);--glass-bg-hover:rgba(64,64,70,.6);--glass-fg:#f2f2f0;--glass-hi:rgba(255,255,255,.2);--glass-rim:rgba(255,255,255,.4);--glass-rim2:rgba(255,255,255,.08);--glass-shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"] body.inbody,:root[data-theme="dark"].toc-lock body{--glass-bg:rgba(44,44,48,.45);--glass-bg-hover:rgba(64,64,70,.6);--glass-fg:#f2f2f0;--glass-hi:rgba(255,255,255,.2);--glass-rim:rgba(255,255,255,.4);--glass-rim2:rgba(255,255,255,.08);--glass-shadow:rgba(0,0,0,.4)}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:3px;border-radius:4px}

/* 진행 막대와 떠 있는 내비게이션 */
body{--progress:var(--g2,#79eae4)}
body.inbody,.toc-lock body{--progress:var(--g1,#0068cc)}
.progress{position:fixed;top:0;left:0;z-index:55;height:6px;background:var(--progress);transition:width .45s cubic-bezier(.16,1,.3,1),background-color .5s ease}
.nav{position:fixed;inset:0 0 auto;z-index:50;height:0;pointer-events:none}
.round,.pill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);pointer-events:auto;height:46px;isolation:isolate;color:var(--glass-fg);background:var(--glass-bg);-webkit-backdrop-filter:blur(14px) saturate(180%) brightness(1.06);backdrop-filter:blur(14px) saturate(180%) brightness(1.06);border:none;box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.08),inset 0 0 16px rgba(255,255,255,.07),0 8px 24px var(--glass-shadow);text-decoration:none;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s,transform .2s}
.round::before,.pill::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,var(--glass-rim) 0%,rgba(255,255,255,.06) 38%,rgba(255,255,255,.02) 62%,var(--glass-rim2) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
.round{width:46px;border-radius:50%;display:grid;place-items:center}
.round.prev{left:30px}
.round.next{right:30px}
.round svg{width:20px;height:20px}
.round[aria-disabled="true"]{opacity:0;pointer-events:none}
.round:hover,.pill:hover{background:var(--glass-bg-hover)}
.round:active{transform:scale(.95)}
.pill:active{transform:translateX(-50%) scale(.97)}
.round:focus-visible,.pill:focus-visible{outline:2px solid var(--glass-fg);outline-offset:3px}
.pill{left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:calc(100% - 172px);padding:0 22px 0 18px;border-radius:999px;font-size:16px;font-weight:650;letter-spacing:-0.01em;white-space:nowrap}
.pill svg{flex:none;width:18px;height:18px}

/* Figma Cover > Gradient(1440×900)의 타원 5개와 같은 위치·크기·회전·흐림 */
/* 간지 배경: Figma Cover > Gradient를 한 번 렌더링해 둔 이미지(장 이동 때 다시 그리지 않음) */
.cover-title{position:absolute;left:6vw;right:6vw;bottom:13.6%;display:flex;flex-direction:column;align-items:center;gap:15px;text-align:center}
.cover .no{display:none}
.cover h1{margin:0;font-size:clamp(44px,7.12vw,104px);line-height:1.08;font-weight:700;letter-spacing:-0.03em;color:#ffffff;text-shadow:0 4px 12px rgba(255,255,255,.25);outline:none;animation:titleIn 1s cubic-bezier(.16,1,.3,1) .08s both}
@keyframes titleIn{from{opacity:0;filter:blur(10px);transform:translate3d(0,16px,0)}to{opacity:1;filter:none;transform:none}}
.cover .sub{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:10px;row-gap:2px;animation:titleIn 1s cubic-bezier(.16,1,.3,1) .22s both}
.cover .ko{margin:0;font-size:clamp(20px,2.22vw,32px);font-weight:600;line-height:1.4;letter-spacing:-0.01em;color:#ffffff}
.cover .sep{font-size:clamp(20px,2.22vw,32px);font-weight:500;line-height:1.4;color:#ffffff}
.cover .period{margin:0;font-size:clamp(20px,2.22vw,32px);font-weight:500;line-height:1.4;color:#ffffff;font-variant-numeric:tabular-nums}
.cover-foot{position:absolute;left:30px;right:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;column-gap:24px;color:rgba(255,255,255,.72)}
.mini{position:relative;width:min(360px,100%);height:30px;justify-self:start}
.mini .base{position:absolute;left:0;right:0;top:21px;height:1px;background:rgba(255,255,255,.45)}
.mini .tick{position:absolute;top:0;font-size:11px;line-height:1;transform:translateX(-50%);font-variant-numeric:tabular-nums;color:rgba(255,255,255,.62)}
.mini .tick.first{transform:none}
.mini .tick::after{content:"";position:absolute;left:50%;top:15px;width:1px;height:6px;background:rgba(255,255,255,.45)}
.mini .tick.first::after{left:0}
.mini .span{position:absolute;top:17px;height:9px;border-radius:2px;background:#ffffff}
.hint{grid-column:2;text-align:center;white-space:nowrap;font-size:clamp(14px,1.25vw,18px);color:#ffffff}
.counter{grid-column:3;justify-self:end;font-size:13px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7)}

/* 본문 */
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.intro{padding:138px 0 50px 90px}
.intro h2{margin:0;font-size:clamp(26px,3vw,36px);font-weight:760;letter-spacing:-0.025em;line-height:1.3}
.intro .period{display:flex;align-items:center;gap:12px;margin:10px 0 0;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.intro .lead{max-width:946px;margin:28px 0 0;font-size:19px;line-height:1.85}

.part{padding:64px 0 0;scroll-margin-top:24px}
.part h2{margin:0 0 20px;font-size:clamp(22px,2.4vw,28px);font-weight:760;letter-spacing:-0.02em;line-height:1.35}
/* 보기 전환 */
.view-bar{display:flex;justify-content:flex-end;padding:40px 0 0}
.view-toggle{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--toc-bg);border:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.view-toggle button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:none;border-radius:999px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.view-toggle button svg{width:16px;height:16px;flex:none}
.view-toggle button:hover{color:var(--ink)}
.view-toggle button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* 넘겨 보기: 도판을 크게, 좌우로 넘기기 */
.mode-slide .part{padding-top:56px}
.mode-slide .part h2{padding-left:90px}
.track{--cw:min(990px,84vw,calc(78vh * 1.26));--gap:48px;position:relative;display:flex;gap:var(--gap);width:100vw;margin-left:calc(50% - 50vw);padding:4px calc((100vw - var(--cw)) / 2) 8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;outline:none;align-items:flex-start}
.track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:none;width:var(--cw);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--bg);scroll-snap-align:center;scroll-snap-stop:always;opacity:.45;transition:opacity .35s ease}
.slide.is-active{opacity:1}
.track:focus-visible .slide.is-active{outline:2px solid var(--c);outline-offset:4px}
.slide.text-only{background:var(--panel)}
.s-img{position:relative;flex:none;aspect-ratio:882/542;overflow:hidden;background:var(--box)}
.s-body{padding:24px 48px 28px}
.slide.text-only .s-body{padding:28px}
.slide:not(.text-only) .s-body{flex:1}
.kw{white-space:nowrap}
.zoom{position:absolute;inset:0;display:block;width:100%;height:100%;margin:0;padding:0;border:0;background:none;overflow:hidden;cursor:zoom-in}
.zoom:focus-visible{outline:2px solid var(--c);outline-offset:-3px}
.slide:not(.is-active) .zoom{cursor:pointer}
.zoom .photo{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;object-fit:cover}
.zoom .photo.fit{object-fit:contain}
.zoom .photo.crop{inset:auto;object-fit:fill}
.plates.single{grid-template-columns:minmax(0,1fr)}
.photo-plate{position:relative;margin:0;padding:0;overflow:hidden;aspect-ratio:882/542}
html.lb-lock{overflow:hidden}
.lb{position:fixed;inset:0;z-index:80;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;color:#f2f2f0;background:rgba(8,9,12,.62);-webkit-backdrop-filter:blur(24px) saturate(.85);backdrop-filter:blur(24px) saturate(.85);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}

.lb.open .lb-img{transform:none}
.lb-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:20px;padding:18px 28px calc(env(safe-area-inset-bottom,0px) + 24px)}
.lb-cap{margin:0;min-width:0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.7)}

.lb-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

.slide .s-no{margin:0 0 8px;font-size:14px;font-weight:760;letter-spacing:.02em;color:var(--c0);font-variant-numeric:tabular-nums}
.slide h3{margin:0 0 4px;font-size:clamp(20px,1.9vw,26px);font-weight:720;letter-spacing:-0.015em;line-height:1.35}

.t-count{margin-right:6px;font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.t-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .2s,opacity .2s}
.t-btn:hover{border-color:var(--ink)}
.t-btn:disabled{opacity:.3;cursor:default}
.t-btn svg{width:18px;height:18px}
#view{overflow-x:clip}
.item{position:relative;display:grid;grid-template-columns:400px minmax(0,1fr);gap:40px;align-items:start;padding:40px 0}

.plate{display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:4/3;padding:12px 14px;border:1px solid var(--line);border-radius:4px;text-decoration:none;
  background-color:var(--box)}
.plate .pn{font-size:15px;font-weight:760;color:var(--c0);font-variant-numeric:tabular-nums}
.plate .find{align-self:flex-start;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.plate:hover .find{border-color:var(--c)}
.pn-text{font-size:15px;font-weight:760;color:var(--c);font-variant-numeric:tabular-nums;padding-top:4px}
.body h3{margin:0 0 4px;font-size:22px;font-weight:720;letter-spacing:-0.015em;line-height:1.4}
.works{margin:0 0 12px;font-size:15px;line-height:1.6;color:var(--ink-2)}
.text{margin:0;max-width:38em}
.i-no{margin:0 0 8px;font-size:14px;font-weight:760;letter-spacing:.02em;color:var(--c0);font-variant-numeric:tabular-nums}
.meta h3{margin:0 0 4px;font-size:24px;font-weight:720;letter-spacing:-0.015em;line-height:1.35}
.meta .works{margin:0 0 8px}
.meta .text,.detail .text,.detail .steps,.detail .events{max-width:none}
.detail > :first-child{margin-top:0}
.tag{display:inline-block;margin-left:8px;padding:0 8px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:650;line-height:1.7;color:var(--c);vertical-align:4px;letter-spacing:0}
.steps{margin:14px 0 0;padding-left:1.6em;max-width:38em}
.steps li{padding:2px 0}
.steps li::marker{color:var(--c);font-weight:700;font-variant-numeric:tabular-nums}
.events{list-style:none;margin:14px 0 0;padding:0;max-width:40em}
.events li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px dashed var(--line)}
.events b{font-weight:760;color:var(--c);font-variant-numeric:tabular-nums}

.summary{margin:64px 0 0;padding:28px 32px 32px;background:var(--box);border-radius:15px}
.summary h2{margin:0 0 16px;font-size:18px;font-weight:760}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{padding:5px 14px;border:1.5px solid transparent;border-radius:999px;background:var(--bg);font-size:15px;font-weight:600;line-height:1.5}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:80px 0 0;padding:0 0 24px}
.pager a{display:block;padding:20px 44px;border:1px solid var(--line);border-radius:15px;text-decoration:none}
.pager a:hover{border-color:var(--ink)}
.pager span{display:block;font-size:13px;color:var(--ink-2)}
.pager strong{display:block;margin-top:2px;font-size:20px;font-weight:720;letter-spacing:-0.01em;line-height:1.4}
.pager .next{grid-column:2;text-align:right}
.foot{padding:16px 0 48px;font-size:13px;color:var(--ink-3)}

/* 표지 목차 */
.index{list-style:none;margin:0;padding:0}
.index-head,.index a{display:grid;grid-template-columns:44px minmax(0,1fr) 104px 42%;gap:16px;align-items:center}
.index-head{padding:8px 0 10px;font-size:12px;color:var(--c0)}
.index a{padding:14px 0;border-top:1px solid var(--line);text-decoration:none}
.index a:hover .i-ko{text-decoration:underline;text-underline-offset:4px}
.i-no{font-weight:760;color:var(--c0);font-variant-numeric:tabular-nums}
.i-ko{font-size:18px;font-weight:650;letter-spacing:-0.01em;line-height:1.45}
.i-yr{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.i-bar,.i-axis{position:relative;height:14px}
.i-axis{height:16px}
.i-bar s,.i-axis s{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.i-axis em{position:absolute;top:0;font-style:normal;font-size:11px;color:var(--c0);transform:translateX(-50%);font-variant-numeric:tabular-nums}

.src{margin:16px 0 0;font-size:14px;color:var(--ink-2)}
.link-table th:first-child,.link-table td:first-child{width:34.7%}
.link-table a{color:var(--ink);text-underline-offset:3px}
.src a{text-underline-offset:3px}

/* 목차 창 */
:root{--toc-bg:#f2f2f6;--toc-card:#ffffff;--toc-line:#e2e2e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--toc-bg:#0d0d0e;--toc-card:#1c1c1e;--toc-line:#2f2f33}}

.toc{position:fixed;inset:0;z-index:48;overflow-y:auto;overscroll-behavior:contain;background:var(--toc-bg);color:var(--ink);opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s linear .22s}
.toc.open{opacity:1;visibility:visible;transition:opacity .22s ease}
.toc-fade{position:sticky;top:0;z-index:2;height:calc(env(safe-area-inset-top,0px) + 92px);margin-bottom:calc(-1 * (env(safe-area-inset-top,0px) + 92px));background:linear-gradient(var(--toc-bg) 62%,transparent);pointer-events:none}

.toc.open .toc-in{transform:none}

.toc-card{list-style:none;margin:0;padding:4px 0;border-radius:22px;background:var(--toc-card);overflow:hidden}
.toc-card a{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:20px;align-items:stretch;text-decoration:none;color:var(--ink)}
.toc-card .t-no{display:flex;align-items:center;padding-left:30px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.toc-card .t-main{display:grid;grid-template-columns:minmax(0,1fr) 52px;align-items:center;min-height:56px;padding:12px 0;border-bottom:1px solid var(--toc-line)}
.toc-card li:last-child .t-main{border-bottom:none}
.t-en{font-size:17px;line-height:1.45;letter-spacing:-0.01em}
.t-ko{margin-left:8px;font-size:14px;color:var(--ink-3)}
.t-check{justify-self:center;width:20px;height:20px;color:var(--c0);visibility:hidden}
.toc-card a[aria-current="page"] .t-en{font-weight:720}
.toc-card a[aria-current="page"] .t-check{visibility:visible}
.toc-card a:hover .t-en{text-decoration:underline;text-underline-offset:4px}
.toc-card a:focus-visible{outline:2px solid var(--c);outline-offset:-3px;border-radius:14px}
.toc-bot{position:fixed;left:0;right:0;bottom:0;height:72px;background:linear-gradient(transparent,var(--toc-bg));pointer-events:none}
.part h2:focus{outline:none}

  .round,.pill{height:42px;top:calc(env(safe-area-inset-top,0px) + 12px)}

  .plates{gap:12px}
  .plate{padding:10px}

  .pager a{padding:18px 24px}
  .part{padding-top:48px}
  .mode-slide .part h2{padding-left:0}
  .view-bar{padding-top:28px}
  .track{--cw:86vw;--gap:14px}
  .lb-stage{padding:calc(env(safe-area-inset-top,0px) + 64px) 12px 8px}
  .lb-bar{grid-template-columns:1fr;justify-items:center;gap:12px;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center}
  .lb-close{right:12px}
  .s-body,.slide.text-only .s-body{padding:18px 18px 20px}
  .pager{grid-template-columns:1fr}
  .pager .next{grid-column:1}
  .index-head{display:none}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
const CH = [
{ id:"ch-1", no:"01", en:"Industrial Revolution", ko:"산업혁명과 디자인의 태동", period:"18세기 후반 – 19세기", span:[1760,1900],
  lead:"산업혁명은 ‘누가, 누구를 위해 만드는가’를 바꿨다. 기계가 손을 대신하면서 설계와 제작이 분리되었고, 값싼 공장 제품이 새로 생긴 중산층의 생활을 채웠다. 1851년 런던 만국박람회는 기술의 발전과 형태의 혼란을 동시에 보여 주며 디자인 개혁 논의의 출발점이 되었다.",
  parts:[{ items:[
    {n:"1-1", t:"공방에서 공장으로", w:"제임스 와트의 개량 증기기관, 1769 특허", x:"18세기 후반 영국에서 기계와 공장 중심의 생산이 확대되었다. 와트가 개량한 증기기관은 공장이 물가를 떠나 도시로 모일 수 있게 한 동력이었다. 분업과 대량생산이 발달하면서 설계·제작·유통이 각자의 일로 나뉘었고, 산업사회에 맞는 디자인의 역할이 생겨났다.", q:"James Watt steam engine 1769"},
    {n:"1-2", t:"조사이어 웨지우드", w:"퀸즈웨어(1760년대), 재스퍼웨어(1770년대)", x:"도공 조사이어 웨지우드는 공정을 나눈 분업과 표준 틀로 같은 품질의 도자기를 대량 생산했다. 부조 장식의 본은 조각가에게 맡기고 생산은 공장이 맡아 디자인과 제작이 분리된 초기 사례가 되었다. 카탈로그와 전시실로 새 중산층 시장도 넓혔다.", q:"Wedgwood jasperware queensware"},
    {n:"1-3", t:"수정궁", w:"조지프 팩스턴, 1851 런던 만국박람회", x:"1851년 런던 만국박람회를 위해 조지프 팩스턴이 온실 구조를 응용해 설계한 전시장으로, 철과 유리의 규격 부품을 조립해 지었다. 건물은 산업 기술의 가능성을 보여 주었지만, 옛 양식을 흉내 내고 장식을 지나치게 붙인 출품작들은 공장 제품의 질을 둘러싼 논쟁을 불러왔다.", q:"Crystal Palace 1851 Joseph Paxton"},
    {n:"1-4", t:"디자인 개혁의 시작", w:"만국박람회 출품 가구·금속기, 오언 존스 『장식의 문법』(1856)", x:"박람회는 공장 제품의 질 문제를 널리 드러냈다. 헨리 콜과 오언 존스 등은 박물관(현 V&A)과 디자인 교육, 장식의 원리를 정리한 책으로 질을 높이려 했고, 러스킨과 모리스는 분업으로 잃어버린 일하는 기쁨과 생활의 아름다움을 되찾는 데 주목했다.", q:"Owen Jones Grammar of Ornament 1856"},
    {n:"1-5", t:"토넷 No.14", w:"미하엘 토넷, 1859", x:"미하엘 토넷은 증기로 휜 목재를 규격 부품으로 만들고 나사로 조립했다. 분해해서 실어 나르고 대량생산해 값을 크게 낮추면서 유럽 카페 의자의 표준이 되었다. 형태뿐 아니라 만드는 방식과 옮기는 방식까지 함께 설계한 사례다.", q:"Thonet No. 14 chair 1859"},
    {n:"1-6", t:"크리스토퍼 드레서", w:"토스트 랙·찻주전자, 1878~1879년경", x:"스코틀랜드 출신 크리스토퍼 드레서는 여러 제조업체와 협업한 초기 전문 산업디자이너 중 한 명이다. 산업 생산을 받아들이면서도 재료와 용도에 맞는 간결한 형태를 탐구했고, 1876~1877년 일본을 직접 방문해 공예에서 영감을 얻었다.", q:"Christopher Dresser teapot toast rack"},
    {n:"1-7", t:"형태는 기능을 따른다", w:"루이스 설리번, 1896", x:"설리번은 1896년 고층 건축을 논하며 ‘형태는 기능을 따른다’고 썼다. 이는 산업화 이후 형태와 용도의 관계를 묻는 흐름을 보여 준다. 이후 기능주의의 구호가 되었지만, 설리번 자신은 장식도 적극적으로 사용했다.", q:"Louis Sullivan Wainwright Building"}
  ]}],
  kw:["분업과 표준화","디자인과 제작의 분리","1851 만국박람회","공장 제품의 품질 문제","디자인 개혁의 시작","옛 양식 흉내 내기","기계로 찍어 낸 지나친 장식","철과 유리로 지은 건물"] },

{ id:"ch-2", no:"02", en:"Arts & Crafts", ko:"미술공예운동", period:"1860 – 1910년경", span:[1860,1910],
  lead:"미술공예운동은 기계 생산이 만든 질 낮은 물건에 맞서 수공예의 정직함과 생활 속 예술을 되살리려 한 운동이다. 사상은 존 러스킨이, 실천은 윌리엄 모리스가 이끌었다. 결과물이 비싸 대중에게 닿지 못한 한계를 남겼지만, ‘디자인은 삶의 질과 사회의 문제’라는 생각을 근대 디자인에 물려주었다.",
  parts:[{ items:[
    {n:"2-1", t:"존 러스킨", w:"『베네치아의 돌』, 1851~1853", x:"미술 비평가 존 러스킨은 중세 고딕 장인의 자유로운 노동에서 아름다움의 근원을 찾았다. 반대로 기계적인 분업은 노동자를 기계 부품처럼 만든다고 비판했다. 만드는 사람의 기쁨이 담긴 물건이 아름답다는 이 생각은 모리스에게 이어져 운동의 바탕이 되었다.", q:"John Ruskin Stones of Venice"},
    {n:"2-2", t:"레드 하우스", w:"필립 웹 설계, 1859~1860", x:"모리스가 결혼 후 살 집을 친구인 건축가 필립 웹에게 맡겼다. 붉은 벽돌을 그대로 드러낸 소박한 외관에, 마음에 드는 가구가 없어 친구들과 벽화와 가구를 직접 만들었다. 이 경험이 1861년 공방 설립으로 이어지며 운동의 출발점이 되었다.", q:"Red House Philip Webb William Morris"},
    {n:"2-3", t:"윌리엄 모리스", w:"벽지 〈트렐리스〉(1862), 직물 〈딸기 도둑〉(1883)", x:"레드 하우스의 경험을 바탕으로 1861년 동료들과 공방(후의 모리스 상회)을 세워 벽지, 직물, 가구, 스테인드글라스를 만들었다. 정원의 식물과 새를 반복 패턴으로 엮은 평면적 문양이 특징이며, 〈딸기 도둑〉은 천연 염료와 목판으로 찍었다.", q:"William Morris Strawberry Thief Trellis wallpaper"},
    {n:"2-4", t:"유용하거나 아름답거나", w:"모리스의 1880년 강연 「생활의 아름다움」", x:"모리스는 쓸모를 확신하거나 아름답다고 믿는 물건을 집에 두라고 권했다. 물건의 수를 늘리기보다, 유용함과 아름다움을 일상에서 누리는 삶을 강조했다. 골풀 좌석의 서식스 의자처럼 모리스 상회는 비교적 소박한 생활 가구도 만들었다.", q:"William Morris interior Kelmscott Manor", noPlate:true},
    {n:"2-5", t:"켈름스콧 프레스", w:"『초서 작품집』, 1896", x:"말년의 모리스가 1891년 세운 출판사로, 기계 인쇄로 질이 떨어진 책을 중세 필사본처럼 되살리려 했다. 활자를 직접 디자인하고 장식 테두리와 번 존스의 삽화를 한 지면에서 함께 설계해, 책 전체를 하나의 디자인으로 다뤘다.", q:"Kelmscott Chaucer 1896"},
    {n:"2-6", t:"길드와 국제적 확산", w:"C. R. 애슈비의 수공예 길드(1888), 구스타프 스티클리의 크래프츠먼 가구(1900년대)", x:"‘미술공예’라는 이름은 1887년 결성된 미술공예전시협회에서 나왔다. 운동은 애슈비의 수공예 길드 같은 공동체로 이어졌고, 미국에서는 스티클리가 단순하고 튼튼한 크래프츠먼 가구로 생활 속 확산을 시도했다. 이 정신은 독일공작연맹으로 넘어간다.", q:"Gustav Stickley Craftsman furniture", opt:true},
    {n:"2-7", t:"이상과 한계", w:"", x:"미술공예운동은 만드는 노동과 생활 속 예술의 가치를 되살리려 했다. 그러나 머턴 애비 공방에서 손으로 짠 태피스트리처럼 수공예품은 값이 비싸, 모두를 위한 예술이라는 이상과 어긋났다. 이 과제는 기계 생산과 예술을 결합하려는 다음 운동으로 이어졌다.", noPlate:true}
  ]}],
  kw:["러스킨(사상)","모리스(실천)","정직한 손작업","생활 속 예술","비싸서 대중에게 못 닿은 한계","중세·고딕 양식의 부활","식물 무늬의 반복 패턴"] },

{ id:"ch-3", no:"03", en:"Art Nouveau", ko:"아르누보", period:"1890 – 1910년경", span:[1890,1910],
  lead:"아르누보는 과거 양식의 모방을 거부하고 덩굴, 꽃, 흘러내리는 머리카락 같은 자연의 곡선으로 ‘새로운 예술’을 만들려 했다. 철과 유리, 컬러 석판 포스터, 일본 목판화의 영향을 받아 건축부터 장신구까지 퍼졌다. 빈과 글래스고에서는 곡선이 직선과 격자로 바뀌며 모더니즘을 예고했다.",
  parts:[
  { title:"자연의 곡선", items:[
    {n:"3-1", t:"같은 시기의 세계", w:"", noPlate:true, events:[["1885","시카고에 철골 구조 고층 건물(홈 인슈어런스 빌딩) 등장, 티파니 유리 회사 설립"],["1886","카를 벤츠의 3륜 자동차 특허"],["1888","코닥 박스 카메라 출시"],["1889","파리 만국박람회와 에펠탑 완공"]]},
    {n:"3-2", t:"이름의 유래", w:"지크프리트 빙의 상점 ‘메종 드 라르 누보’, 파리, 1895", x:"미술상 지크프리트 빙이 1895년 파리에 연 상점 ‘새로운 예술의 집’은 ‘아르누보’라는 이름을 널리 알렸다. 독일의 유겐트슈틸, 빈 분리파, 카탈루냐의 모데르니스메 등은 나라마다 다른 이름으로 옛 양식에서 벗어난 새로운 형태를 찾았다.", q:"Maison de l Art Nouveau Siegfried Bing 1895"},
    {n:"3-3", t:"자포니즘", w:"가쓰시카 호쿠사이 〈가나가와 해변의 높은 파도 아래〉, 1831년경", x:"1850년대 일본이 나라의 문을 연 뒤 유럽에 우키요에 목판화가 쏟아져 들어왔다. 평면 색면, 굵은 윤곽선, 비대칭 구도는 원근법에 익숙한 유럽 화가들에게 새로운 시각이었고, 아르누보 그래픽에 직접 영향을 주었다. 빙도 일본 미술을 다룬 상인이었다.", q:"Hokusai Great Wave off Kanagawa"},
    {n:"3-4", t:"쥘 셰레", w:"거리 포스터, 1870~1890년대", x:"쥘 셰레는 여러 색을 겹쳐 찍는 컬러 석판 인쇄로 파리 거리를 밝은 포스터로 채웠다. 경쾌하게 움직이는 여성 인물과 큼직한 글자로 멀리서도 눈에 띄는 광고를 만들어 ‘현대 포스터의 아버지’로 불린다. 그가 연 길을 로트레크와 무하가 이어받았다.", q:"Jules Chéret poster"},
    {n:"3-5", t:"앙리 드 툴루즈로트레크", w:"〈물랭 루주 — 라 굴뤼〉, 1891", x:"몽마르트르에서 활동한 툴루즈로트레크는 첫 포스터 〈물랭 루주 — 라 굴뤼〉로 카바레의 무희를 그렸다. 일본 판화에서 배운 넓은 평면 색과 검은 실루엣, 과감하게 자른 구도로 회화와 상업 포스터의 경계를 허물었다. 포스터는 거리의 예술이 되었다.", q:"Toulouse-Lautrec Moulin Rouge La Goulue 1891"},
    {n:"3-6", t:"알폰소 무하", w:"〈지스몽다〉(1894 디자인·1895 게시), 〈JOB〉·〈사계〉(1896)", x:"배우 사라 베르나르의 연극 〈지스몽다〉 포스터로 이름을 알렸다. 긴 세로 화면, 후광 같은 원형 장식, 흘러내리는 머리카락과 꽃이 ‘무하 양식’이 되었고, 담배 종이 〈JOB〉 같은 상품 광고와 장식 패널 〈사계〉로 이어졌다.", q:"Alphonse Mucha Gismonda JOB poster"},
    {n:"3-7", t:"오브리 비어즐리", w:"『살로메』 삽화, 1894", x:"영국의 오브리 비어즐리는 오스카 와일드의 희곡 『살로메』 삽화에서 강한 흑백 대비, 섬세한 선과 넓은 면으로 인물과 장식을 구성했다. 일본 판화와 세기말의 어둡고 퇴폐적인 분위기가 어우러진 삽화는 책과 잡지의 표현 방식을 넓혔다.", q:"Aubrey Beardsley Salome illustration", opt:true},
    {n:"3-8", t:"공예의 아르누보", w:"에밀 갈레의 유리 화병, 루이스 컴퍼트 티파니의 램프, 르네 랄리크의 장신구", x:"그래픽만큼 공예에서도 자연의 곡선이 꽃피었다. 프랑스 낭시의 에밀 갈레는 유리 화병에 식물과 곤충을 새겼고, 미국의 티파니는 색유리 조각으로 램프를 만들었으며, 르네 랄리크는 잠자리와 꽃 모양 장신구를 만들었다. 장인 기술이 정점에 이른 시기다.", q:"Emile Galle vase Tiffany lamp Lalique jewelry"},
    {n:"3-9", t:"빅토르 오르타", w:"오텔 타셀 계단실, 브뤼셀, 1893", x:"브뤼셀의 빅토르 오르타가 설계한 오텔 타셀은 초기 아르누보 건축의 대표 사례다. 철 구조를 숨기지 않고 유리로 빛을 끌어들였으며, 계단 난간·바닥·벽의 곡선을 연결해 건축과 실내 장식을 하나의 환경으로 통합했다.", q:"Victor Horta Hotel Tassel staircase"},
    {n:"3-10", t:"헥토르 기마르", w:"파리 지하철 입구, 1900", x:"헥토르 기마르는 1900년 파리 만국박람회에 맞춰 개통한 지하철의 입구를 디자인했다. 식물 줄기 같은 주철 기둥과 유리 지붕을 규격 부품으로 만들어 여러 역에 조합해 설치했다. 장식적인 아르누보도 표준화된 생산과 만날 수 있음을 보여 준 사례다.", q:"Hector Guimard Paris Metro entrance"},
    {n:"3-11", t:"안토니 가우디", w:"사그라다 파밀리아, 1882 착공·1883 가우디가 설계 계승", x:"가우디는 카탈루냐 모데르니스메 안에서 독자적인 건축을 발전시켰다. 나뭇가지 같은 기둥과 자연에서 착안한 기하학으로 구조·빛·상징을 결합했다. 1883년부터 맡은 사그라다 파밀리아는 그의 사후 100년이 지난 지금도 공사 중이다.", q:"Sagrada Familia Gaudi"},
    {n:"3-12", t:"카사 바트요", w:"안토니 가우디, 바르셀로나, 1904~1906", x:"뼈와 비늘을 연상시키는 외관, 빛에 따라 달라지는 타일, 유기적인 실내를 결합해 ‘뼈의 집’이라는 별명으로도 불린다. 기존 주택을 개조하며 구조와 장식, 가구까지 연결한 가우디의 통합적 설계로, 건축이 하나의 조각처럼 다뤄졌다.", q:"Casa Batllo Gaudi interior facade"},
    {n:"3-13", t:"찰스 레니 매킨토시", w:"글래스고 미술학교(1897~1909), 힐 하우스 의자(1902~1903)", x:"글래스고의 매킨토시는 높은 등받이의 힐 하우스 의자처럼 수직선과 격자 같은 기하학적 구성에 절제된 식물 모티프를 결합했다. 유기적 곡선만으로 설명되지 않는 아르누보의 또 다른 방향이며, 빈의 디자이너들에게도 영향을 주었다.", q:"Charles Rennie Mackintosh Hill House chair Glasgow School of Art"}
  ]},
  { title:"빈 분리파와 빈 공방", items:[
    {n:"3-14", t:"분리파 전시관", w:"요제프 마리아 올브리히, 빈, 1898", x:"1897년 클림트를 중심으로 한 빈의 젊은 미술가들이 옛 양식만 고집하던 미술가 협회에서 떨어져 나와 만든 단체다. 올브리히가 설계한 흰 상자 같은 전시관 위에 금빛 월계수 잎 돔을 얹고, 입구에 “시대에는 그 시대의 예술을, 예술에는 자유를”이라고 새겼다.", q:"Vienna Secession building Olbrich 1898"},
    {n:"3-15", t:"구스타프 클림트", w:"〈키스〉(1907~1908), 스토클레 프리즈 〈생명의 나무〉(1905~1911)", x:"분리파 초대 회장 구스타프 클림트는 금박과 소용돌이, 사각 문양으로 화면을 채워 회화와 장식의 경계를 허물었다. 〈키스〉와 스토클레 저택 식당 벽을 장식한 〈생명의 나무〉가 대표작이다. 그의 장식성은 빈 공방의 공예·건축과 함께 움직였다.", q:"Klimt The Kiss Tree of Life Stoclet Frieze"},
    {n:"3-16", t:"빈 공방", w:"요제프 호프만 ‘시츠마시네’(1905년경), 콜로만 모저의 금속기, 스토클레 저택(1905~1911)", x:"1903년 요제프 호프만과 콜로만 모저가 세운 공방으로, 미술공예운동의 생각을 잇되 정사각형과 격자의 기하학으로 정리했다. 등받이를 조절하는 호프만의 ‘앉는 기계’도 그 예다. 스토클레 저택은 건축부터 가구, 식기까지 하나의 작품처럼 통합 설계했다.", q:"Josef Hoffmann Sitzmaschine Wiener Werkstatte"},
    {n:"3-17", t:"아돌프 로스", w:"「장식과 범죄」(1910 강연·1913 프랑스어 발표), 로스하우스(1909~1911)", x:"로스는 시대에 맞지 않는 장식이 노동과 재료를 낭비한다고 비판했다. 다만 실내에는 대리석과 목재의 풍부한 질감을 활용했다. 그의 주장은 장식을 모두 없애자는 것이라기보다, 새 시대의 생활에 맞는 형태가 무엇인지 묻는 논쟁으로 읽어야 한다.", q:"Adolf Loos Looshaus Vienna"}
  ]}],
  kw:["자연의 곡선","자포니즘(일본 미술의 영향)","컬러 석판화 포스터","철과 유리","나라마다 다른 이름","빈·글래스고의 직선과 격자","로스의 장식 비판","채찍처럼 휘는 곡선","비대칭의 유기적 형태","평평한 색면과 굵은 윤곽선"] },

{ id:"ch-4", no:"04", en:"Deutscher Werkbund", ko:"독일공작연맹", period:"1907 – 1930년대", span:[1907,1933],
  lead:"독일공작연맹은 예술가, 산업가, 정치인이 ‘기계 생산품의 질을 높이자’며 1907년 뮌헨에서 결성한 단체다. 미술공예운동이 기계를 거부했다면 공작연맹은 기계를 받아들이고 표준화로 좋은 물건을 대량생산하려 했다. 미술공예운동과 바우하우스를 잇는 다리이자 산업디자이너와 기업 아이덴티티(CI)의 출발점이다.",
  parts:[{ items:[
    {n:"4-1", t:"헤르만 무테지우스", w:"1907년 뮌헨에서 공작연맹 결성", x:"런던 주재 독일 대사관에서 일하며 영국의 주거와 공예를 연구한 무테지우스는 1907년 예술가·장인·기업의 협력을 이끌었다. 좋은 물건을 만들자는 미술공예운동의 생각을 이어받되, 기계 생산으로 좋은 디자인을 널리 퍼뜨리려 한 것이 공작연맹이다.", q:"Hermann Muthesius Deutscher Werkbund"},
    {n:"4-2", t:"페터 베렌스와 AEG", w:"AEG 로고(1908년경), 전기 주전자(1909)", x:"1907년 AEG의 예술 고문이 된 베렌스는 제품·그래픽·건축을 하나로 연결했다. 물건 하나를 넘어 기업 전체의 이미지를 설계한 첫 사례로, 오늘날 기업 아이덴티티(CI)의 출발점이 되었다. 전기 주전자는 몸체, 재질, 마감을 조합해 여러 모델을 만든 표준화 설계다.", q:"Peter Behrens AEG electric kettle 1909"},
    {n:"4-3", t:"AEG 터빈 공장", w:"페터 베렌스, 베를린, 1909", x:"베렌스가 AEG를 위해 지은 터빈 조립 공장이다. 철골과 넓은 유리면으로 거대한 기계를 들일 공간을 만들면서, 신전 같은 비례와 삼각형 지붕선으로 공장에 품위를 더했다. 공장도 건축가가 다룰 문화의 대상이 될 수 있음을 보여 주었다.", q:"AEG Turbine Factory Peter Behrens 1909"},
    {n:"4-4", t:"한 사무소를 거친 세 거장", w:"그로피우스·미스 반 데어 로에·르 코르뷔지에, 1900년대 말~1910년대 초", x:"근대 건축을 이끈 그로피우스, 미스 반 데어 로에, 르 코르뷔지에가 모두 1900년대 말~1910년대 초 베렌스 사무소를 거쳤다. 이들은 이곳에서 산업과 건축을 결합하는 방식을 익혔고, 뒤에 각자 바우하우스와 국제주의 양식으로 그 생각을 발전시켰다.", q:"Walter Gropius Mies van der Rohe Le Corbusier portraits"},
    {n:"4-5", t:"파구스 공장", w:"발터 그로피우스·아돌프 마이어, 1911", x:"그로피우스가 아돌프 마이어와 함께 설계한 구두 틀(구두 골) 공장이다. 얇은 철골에 유리를 매달아 벽 전체를 창처럼 만들고, 모서리 기둥을 없애 유리가 꺾여 돌아가게 했다. 벽을 유리로 두르는 이 방식은 15년 뒤 바우하우스 데사우 건물에서 다시 쓰인다.", q:"Fagus Factory Gropius 1911"},
    {n:"4-6", t:"표준 대 개성", w:"1914 쾰른 공작연맹 전시회, 무테지우스와 앙리 반 데 벨데", x:"1914년 쾰른 공작연맹 전시회에서 무테지우스는 표준화된 ‘유형’이 좋은 디자인을 만든다고, 반 데 벨데는 예술가의 개성이 먼저라고 맞섰다. 당시 풍자화도 두 사람과 실제 의자를 만드는 목수를 나란히 그렸다. ‘표준 대 개성’은 지금도 이어지는 질문이다.", q:"Werkbund exhibition Cologne 1914"},
    {n:"4-7", t:"사물 포스터", w:"루치안 베른하르트 〈프리스터 성냥〉, 1906", x:"같은 시기 베를린의 루치안 베른하르트는 성냥 두 개비와 상표명 ‘프리스터’만 크게 그린 포스터로 이름을 알렸다. 상품 하나와 이름만 보여 주는 이 ‘사물 포스터’는 아르누보 포스터의 장식과 대비되며, 현대 광고의 단순한 전달 방식을 예고했다.", q:"Lucian Bernhard Priester poster"}
  ]}],
  kw:["기계 생산 받아들이기","표준화","베렌스와 AEG(최초의 CI)","표준 대 개성 논쟁","바우하우스의 직접적 뿌리","장식을 뺀 기하학적 형태","철골과 통유리 벽"] },

{ id:"ch-5", no:"05", en:"Avant-garde", ko:"아방가르드: 미래주의 · 다다 · 구성주의", period:"1909 – 1930년대", span:[1909,1930],
  lead:"1차 세계대전과 러시아 혁명을 전후해 예술가들은 기존 질서를 깨는 선언과 실험을 쏟아냈다. 미래주의는 속도와 기계를, 다다는 우연과 부조리를, 구성주의는 새 사회를 위한 생산적 예술을 내세웠다. 셋 모두 글자를 그림처럼 다루며 이후 그래픽 디자인과 타이포그래피의 문법을 바꿨다.",
  parts:[{ items:[
    {n:"5-1", t:"미래주의", w:"마리네티 「미래주의 선언」(『르 피가로』, 1909), 보치오니 〈공간 속에서 연속성의 독특한 형태〉(1913)", x:"1909년 선언으로 출발한 미래주의는 속도·기계·도시를 찬양하며 기존 예술과의 단절을 외쳤다. 보치오니의 조각은 달리는 몸의 움직임을 하나의 덩어리에 담았다. 타이포그래피와 형태 실험을 촉진했지만, 전쟁을 미화한 정치적 태도도 함께 살펴야 한다.", q:"Boccioni Unique Forms of Continuity in Space"},
    {n:"5-2", t:"자유로운 말", w:"마리네티 『장 툼 툼』, 1914", x:"마리네티는 시에서도 문법을 버리고 ‘자유로운 말’을 주장했다. 『장 툼 툼』은 전쟁터의 포성을 크기, 서체, 방향이 제각각인 글자로 흩뿌려 소리와 속도를 지면에 옮겼다. 글자를 읽는 기호를 넘어 보는 이미지로 다룬 타이포그래피 실험이다.", q:"Marinetti Zang Tumb Tuuum"},
    {n:"5-3", t:"다다", w:"카바레 볼테르(취리히, 1916), 마르셀 뒤샹 〈샘〉(1917)", x:"1916년 취리히에서 시작된 다다는 전쟁과 기존 질서에 반발했다. 카바레 볼테르의 소리 시와 공연은 우연과 부조리를 무기로 삼았다. 뒤샹의 〈샘〉은 기성품을 골라 전시하는 행위로, 작품을 만드는 일뿐 아니라 무엇을 예술로 인정하는지까지 질문했다.", q:"Marcel Duchamp Fountain 1917"},
    {n:"5-4", t:"포토몽타주와 콜라주", w:"한나 회흐 〈부엌칼로 자르기〉(1919~1920), 쿠르트 슈비터스 『메르츠』(1923~)", x:"베를린 다다의 한나 회흐는 신문과 잡지 사진을 오려 붙여 당대의 정치와 남성 중심 사회를 풍자했고, 슈비터스는 버스표와 광고 조각으로 『메르츠』를 만들었다. 이미지와 글자를 잘라 다시 짜는 이 기법은 광고와 편집 디자인의 기본 언어가 되었다.", q:"Hannah Hoch Cut with the Kitchen Knife"},
    {n:"5-5", t:"구성주의", w:"블라디미르 타틀린 〈제3인터내셔널 기념탑〉 모형, 1919~1920", x:"1917년 러시아 혁명 이후 예술가들은 예술이 새 사회를 ‘구성’하는 생산 활동이어야 한다고 보았다. 타틀린의 기념탑은 기울어진 나선형 철골 안에 회전하는 공간을 넣으려 한 계획으로, 지어지지 않았지만 구성주의의 상징이 되었다.", q:"Tatlin Monument to the Third International"},
    {n:"5-6", t:"엘 리시츠키", w:"〈붉은 쐐기로 백군을 쳐라〉(1919~1920), 『목소리를 위하여』(1923)", x:"엘 리시츠키는 붉은 쐐기가 흰 원을 찌르는 포스터로 혁명군이 반혁명군을 친다는 메시지를 원, 삼각형, 사각형만으로 전했다. 마야콥스키 시집에서는 활자와 굵은 선으로 지면을 짜고 옆면에 찾아보기 탭을 달아, 책을 읽는 순서까지 설계했다.", q:"El Lissitzky Beat the Whites with the Red Wedge"},
    {n:"5-7", t:"알렉산드르 로드첸코", w:"국영출판사 포스터 〈책〉, 1924", x:"로드첸코는 레닌그라드 국영출판사 광고에서 손을 모아 외치는 여성 사진에 ‘책’이라는 굵은 산세리프를 메가폰처럼 뻗게 했다. 사진, 대각선 구도, 강한 원색의 결합으로 메시지를 소리치듯 전한다. 지금도 자주 패러디되는 포스터다.", q:"Rodchenko Books poster 1924"},
    {n:"5-8", t:"스텐베르크 형제", w:"〈카메라를 든 사나이〉 영화 포스터, 1929", x:"블라디미르와 게오르기 스텐베르크 형제는 지가 베르토프의 실험 영화 포스터에서 사진처럼 정교한 드로잉과 장면을 잘라 이어 붙인 듯한 구성을 결합했다. 크기와 원근을 뒤틀고 활자를 역동적으로 배치해, 영화의 움직임을 인쇄된 포스터로 옮겼다.", q:"Stenberg brothers Man with a Movie Camera poster", opt:true}
  ]}],
  kw:["미래주의(속도·기계)","다다(우연·부조리)","포토몽타주(사진 오려 붙이기)","구성주의(새 사회를 위한 디자인)","글자를 이미지로","사선과 역동적 구도","크기와 모양이 제각각인 글자"] },

{ id:"ch-6", no:"06", en:"De Stijl", ko:"데 스틸", period:"1917 – 1931년경", span:[1917,1931],
  lead:"데 스틸은 1917년 테오 반 두스뷔르흐가 네덜란드에서 창간한 잡지이자 그룹이다. 수직·수평선과 삼원색, 무채색만으로 누구에게나 통하는 조화를 찾으려 했고(신조형주의), 이 원리를 회화에서 가구, 건축, 타이포그래피로 넓혔다. 반 두스뷔르흐가 1921~1922년 바이마르에서 연 강좌는 초기 바우하우스가 기하학으로 방향을 트는 데 영향을 주었다.",
  parts:[{ items:[
    {n:"6-1", t:"『데 스틸』 잡지", w:"빌모스 후사르의 표지 로고, 1917~", x:"1917년 네덜란드에서 테오 반 두스뷔르흐를 중심으로 창간했다. ‘양식’을 뜻하는 잡지 이름이 운동의 이름이 되었으며, 그림·가구·건축에 두루 통하는 단순한 형태 원칙을 찾았다. 빌모스 후사르의 사각 블록 로고처럼 잡지 자체가 그 원칙을 보여 주는 매체였다.", q:"De Stijl magazine cover 1917"},
    {n:"6-2", t:"피트 몬드리안", w:"〈빨강, 파랑, 노랑의 구성〉, 1930", x:"몬드리안은 나무 같은 대상을 점점 추상화한 끝에 수직·수평선, 삼원색, 흰색·검정·회색만 남겼다. 개별 대상을 지우고 보편적 질서를 좇은 이 방식이 신조형주의다. 이 화면 구성이 가구, 건축, 그래픽으로 옮겨 가는 것이 데 스틸의 흐름이다.", q:"Mondrian Composition with Red Blue and Yellow 1930"},
    {n:"6-3", t:"빨강 파랑 의자", w:"헤릿 리트벨트, 1918년경 디자인, 1923년경 채색", x:"가구 제작자 출신 헤릿 리트벨트는 규격 목재와 분리된 색면으로 의자를 구성했다. 그림 속 수직·수평 관계를 공간에서 실험하면서, 쉽게 만들 수 있는 방법도 고민했다. 앉는 기능과 추상적인 공간 구성을 함께 탐구한 가구다.", q:"Rietveld Red and Blue Chair"},
    {n:"6-4", t:"슈뢰더 하우스", w:"헤릿 리트벨트·트뤼스 슈뢰더의 협업, 위트레흐트, 1924", x:"리트벨트가 집주인 트뤼스 슈뢰더와 함께 계획한 집이다. 벽과 난간이 면으로 분리되어 떠 있는 듯한 외관은 그의 의자를 건축으로 키운 듯하다. 2층은 미닫이 칸막이로 방을 나누거나 합칠 수 있으며, 2000년 유네스코 세계유산이 되었다.", q:"Rietveld Schroder House"},
    {n:"6-5", t:"사선을 둘러싼 갈등", w:"반 두스뷔르흐·아르프 부부 〈카페 오베트〉 실내, 스트라스부르, 1926~1928", x:"반 두스뷔르흐는 사선을 활용하는 요소주의로 나아갔다. 수직·수평을 중시한 몬드리안과의 결별은 운동 내부의 차이를 보여 준다. 카페 오베트는 이러한 공간 실험이 실내로 확장된 사례로, 아르프 부부와 함께 벽과 천장을 사선 색면으로 덮었다.", q:"Cafe Aubette Strasbourg van Doesburg", opt:true}
  ]}],
  kw:["신조형주의(선·면·색만으로)","수직·수평과 삼원색","회화에서 가구와 건축으로","바우하우스에 영향","사각형 면의 비대칭 균형","흰색·검정·회색"] },

{ id:"ch-7", no:"07", en:"Bauhaus", ko:"바우하우스", period:"1919 – 1933년", span:[1919,1933],
  lead:"바우하우스는 1919년 발터 그로피우스가 바이마르에 세운 조형학교로, 미술·공예·건축을 하나로 묶고 대량생산할 물건의 시제품을 만드는 교육을 목표로 했다. 14년 동안 바이마르, 데사우, 베를린으로 옮겨 다니다 1933년 나치의 압력으로 문을 닫았다. 교수진이 미국 등으로 건너가면서 그 교육 방식은 세계 디자인 교육의 표준이 되었다.",
  parts:[{ items:[
    {n:"7-1", t:"바우하우스 선언", w:"선언문과 라이오넬 파이닝어의 목판화 〈대성당〉, 1919", x:"1919년 그로피우스가 바이마르에서 발표한 선언문이다. “건축가, 조각가, 화가여, 우리 모두 공예로 돌아가자!” 표지의 대성당 목판화처럼 초기에는 중세 길드를 이상으로 삼았고, 1923년 ‘예술과 기술, 새로운 통일’로 방향을 바꿨다.", q:"Bauhaus manifesto Feininger Cathedral 1919"},
    {n:"7-2", t:"교육 과정", w:"동심원 도식(1922): 예비과정, 공방, 건축", x:"모든 학생은 예비과정에서 재료, 형태, 색을 익힌 뒤 나무, 금속, 직물 같은 공방으로 올라갔고, 도식 한가운데의 건축이 최종 목표였다. 예비과정은 이텐, 이후 모호이너지와 알베르스가 맡았고, 공방마다 예술가와 장인이 함께 가르쳤다.", q:"Bauhaus curriculum diagram 1922"},
    {n:"7-3", t:"바우하우스 데사우 건물", w:"발터 그로피우스, 1925~1926", x:"1925년 데사우로 옮기며 그로피우스가 직접 설계한 학교 건물이다. 철근 콘크리트 뼈대에 유리벽을 두르고, 강의동·공방동·기숙사를 쓰임에 따라 비대칭으로 배치했다. 건물 자체가 학교의 생각을 보여 주는 선언이 되었고, 1996년 유네스코 세계유산이 되었다.", q:"Bauhaus Dessau building Gropius"},
    {n:"7-4", t:"바실리 체어", w:"마르셀 브로이어, B3, 1925", x:"바우하우스 학생이었다가 교수가 된 마르셀 브로이어가 자전거 핸들에서 착안해 강철 파이프를 구부려 만든 의자다. 가볍고 대량생산이 가능한 새 재료로 나무와 천의 의자 개념을 바꿨다. ‘바실리’라는 이름은 뒤에 이 의자를 쓴 칸딘스키에게서 따왔다.", q:"Marcel Breuer Wassily chair"},
    {n:"7-5", t:"마리안네 브란트", w:"찻주전자 MT49(1924), 칸뎀 침대 조명(1928)", x:"원과 반구를 조합한 찻주전자 MT49로 알려진 마리안네 브란트는 금속 공방에서 산업체와의 조명 생산 협력을 이끌었고, 1928~1929년에는 공방 책임자 대행을 맡았다. 기하학적 형태의 수공예 실험이 산업 제품으로 이어지는 과정을 보여 준다.", q:"Marianne Brandt tea infuser MT49"},
    {n:"7-6", t:"유니버설 알파벳", w:"헤르베르트 바이어, 1925", x:"인쇄·광고 공방을 맡은 헤르베르트 바이어는 원과 직선만으로 그린 소문자 산세리프를 제안했다. 말할 때 대문자와 소문자를 구별하지 않는데 왜 글에서는 두 벌을 쓰느냐는 문제 제기였다. 바우하우스 인쇄물은 한동안 소문자만 썼다.", q:"Herbert Bayer universal alphabet 1925"},
    {n:"7-7", t:"라슬로 모호이너지", w:"사진과 포토그램, 『회화, 사진, 영화』(1925)", x:"헝가리 출신 라슬로 모호이너지는 예비과정과 금속 공방을 맡았다. 카메라 없이 인화지에 물체를 올려 빛으로 찍는 포토그램, 사진과 활자를 결합한 ‘타이포포토’를 실험했고, 1937년 시카고에 뉴 바우하우스를 세워 교육을 미국으로 옮겼다.", q:"Moholy-Nagy photogram"},
    {n:"7-8", t:"직조 공방과 무대", w:"군타 슈퇼츨·아니 알베르스의 직물, 오스카 슐레머 〈3부작 발레〉(1922)", x:"슈퇼츨과 아니 알베르스는 직물을 산업과 연결하는 재료 실험을 이끌었다. 여성의 진로가 직조로 제한되는 현실 속에서도 중요한 혁신이 나왔다. 슐레머는 원뿔과 구 모양 의상의 〈3부작 발레〉로 몸·의상·공간의 관계를 실험했다.", q:"Gunta Stolzl Bauhaus weaving Schlemmer Triadic Ballet", opt:true},
    {n:"7-9", t:"바르셀로나 체어", w:"미스 반 데어 로에·릴리 라이히, 1929", x:"미스 반 데어 로에와 릴리 라이히가 1929년 바르셀로나 박람회 독일관을 위해 만든 의자다. X자로 교차하는 강철 다리와 가죽 쿠션으로 모던한 위엄을 표현했다. 미스는 1930년에 교장이 되었으니 그 직전의 작업이다. “적을수록 많다(Less is more).”", q:"Mies van der Rohe Barcelona chair pavilion 1929"},
    {n:"7-10", t:"이동과 망명", w:"교장: 그로피우스(1919~1928), 하네스 마이어(1928~1930), 미스(1930~1933)", noPlate:true, events:[["1919","바이마르에서 개교"],["1925","데사우로 이전"],["1932","베를린으로 이전"],["1933","나치의 압력으로 폐교"],["1937~","그로피우스는 하버드, 미스는 일리노이 공대, 모호이너지는 시카고 뉴 바우하우스, 알베르스는 블랙마운틴 칼리지에서 가르침"]]}
  ]}],
  kw:["예술과 기술의 통일","예비과정(기초 조형 교육)","대량생산을 위한 시제품","기본 도형과 원색","강철 파이프 가구","교수들의 망명과 세계 확산","산세리프와 비대칭 배치","통유리 벽과 평평한 지붕"] },

{ id:"ch-8", no:"08", en:"Art Deco & Streamline", ko:"아르데코와 유선형", period:"1920 – 1930년대", span:[1920,1940],
  lead:"아르데코는 1925년 파리 ‘국제 현대 장식·산업 미술 박람회’에서 이름을 얻은 양식으로, 지그재그·방사선·계단형 장식과 크롬, 옻칠 같은 소재로 화려한 현대성을 표현했다. 바우하우스가 ‘기능의 모던’이라면 아르데코는 ‘장식의 모던’이었다. 1929년 대공황 이후 미국에서는 매끈한 곡면을 소비재 전반에 입힌 유선형이 유행하며 산업디자이너라는 직업이 자리 잡았다.",
  parts:[
  { title:"아르데코", items:[
    {n:"8-1", t:"1925 파리 박람회", w:"박람회 포스터와 전경, 르 코르뷔지에의 에스프리 누보관", x:"1920년대에는 기능을 앞세운 바우하우스와 장식으로 새로움을 보여 준 아르데코가 함께 있었다. 파리 박람회는 그 차이를 보여 준다. 기하학과 기계의 이미지는 절제된 건축뿐 아니라 고급 소비문화의 장식에도 쓰였다. ‘아르데코’라는 이름은 1960년대에 이 박람회 이름을 줄여 붙였다.", q:"Exposition internationale des arts decoratifs 1925 poster"},
    {n:"8-2", t:"크라이슬러 빌딩", w:"윌리엄 반 앨런, 뉴욕, 1930", x:"자동차 회사 크라이슬러의 본사로 지은 마천루다. 스테인리스강 왕관 모양 첨탑에 햇살 무늬를 겹치고, 외벽에는 자동차 휠캡과 라디에이터 장식을 모티프로 썼다. 잠시 세계에서 가장 높은 건물이었고, 아르데코가 미국 도시의 얼굴이 되었다.", q:"Chrysler Building spire 1930"},
    {n:"8-3", t:"마천루와 기계 도시", w:"엠파이어 스테이트 빌딩(1931), 〈메트로폴리스〉 포스터(하인츠 슐츠노이담, 1927)", x:"뉴욕의 마천루는 위로 갈수록 계단처럼 좁아지는데, 거리에 햇빛이 들도록 건물 모양을 제한한 1916년 법의 영향이다. 이 실루엣과 기계 도시의 이미지는 프리츠 랑의 영화 〈메트로폴리스〉 포스터에도 담겼다. 아르데코는 미래 도시의 상징이 되었다.", q:"Metropolis poster 1927 Schulz-Neudamm"},
    {n:"8-4", t:"고급 소재와 매끈한 표면", w:"에밀자크 륄만의 가구, 장 뒤낭의 옻칠 공예, 타마라 드 렘피카 〈녹색 부가티를 탄 자화상〉(1929)", x:"아르데코 가구는 흑단, 상아, 옻칠 같은 고급 소재와 거울처럼 매끈한 표면, 기하학적 장식으로 사치스러운 현대성을 표현했다. 륄만의 가구와 뒤낭의 옻칠 공예가 대표적이다. 바우하우스의 강철 파이프 가구와는 전혀 다른 고객을 향했다.", q:"Ruhlmann furniture Tamara de Lempicka green Bugatti"},
    {n:"8-5", t:"카상드르의 포스터", w:"〈노르 익스프레스〉(1927), 〈노르망디〉(1935)", x:"파리에서 활동한 카상드르는 기차와 배의 속도를 포스터로 그렸다. 〈노르 익스프레스〉는 철로가 한 점으로 모이는 대각선 원근과 에어브러시 그러데이션으로 기관차를 단순화했고, 〈노르망디〉는 올려다본 여객선의 거대한 뱃머리로 웅장한 모습을 보여 주었다.", q:"Cassandre Nord Express Normandie poster"},
    {n:"8-6", t:"〈뒤보네〉", w:"카상드르, 1932", x:"식사 전에 마시는 술 뒤보네의 광고로, 같은 남자가 세 장면에 걸쳐 술을 맛보고 마시고 다시 따르며 점점 색으로 채워진다. 글자도 ‘뒤 보(아름다운)’, ‘뒤 봉(좋은)’, ‘뒤보네’로 완성되는 말장난이다. 지나가며 연속으로 읽히도록 만든 포스터다.", q:"Cassandre Dubonnet poster"}
  ]},
  { title:"유선형과 미국 산업디자인", items:[
    {n:"8-7", t:"스타일링의 등장", w:"레이먼드 로위의 게스테트너 복사기 재디자인, 1929", x:"미국에서는 1920~1930년대 기업의 제품 경쟁과 함께 산업디자인 전문직이 성장했다. 로위는 기계의 외관을 정돈해 사용성과 상품 이미지를 개선했다. 대공황은 판매를 위한 스타일링의 중요성을 더욱 키웠다.", q:"Raymond Loewy Gestetner duplicator before after"},
    {n:"8-8", t:"레이먼드 로위", w:"시어스 콜드스팟 냉장고(1934), 펜실베이니아 철도 S1 기관차(1938), 럭키 스트라이크 담뱃갑(1940)", x:"프랑스 출신 레이먼드 로위는 시어스 냉장고, 펜실베이니아 철도 기관차, 럭키 스트라이크 담뱃갑까지 미국 생활의 겉모습을 바꿨다. 공기 저항과 무관한 연필깎이까지 유선형이 되었다. 그는 ‘가장 진보적이되 받아들일 수 있는’(MAYA) 원칙을 내세웠다.", q:"Raymond Loewy Pennsylvania S1 locomotive"},
    {n:"8-9", t:"헨리 드레이퍼스", w:"벨 전화기 모델 302(1937), 인체 치수 도표 ‘조와 조세핀’", x:"로위가 외관을 다듬었다면 헨리 드레이퍼스는 쓰는 사람의 몸에서 출발했다. 벨 전화기 302로 손에 쥐는 수화기를 정리했고, 평균 남녀의 인체 치수를 그린 ‘조와 조세핀’ 도표로 인간공학의 기초를 놓았다. 『사람을 위한 디자인』(1955)을 남겼다.", q:"Henry Dreyfuss Bell 302 telephone Joe and Josephine"},
    {n:"8-10", t:"〈퓨처라마〉", w:"노먼 벨 게디스, GM, 1939 뉴욕 세계박람회", x:"1939년 뉴욕 세계박람회에서 노먼 벨 게디스가 GM을 위해 만든 거대한 미래 도시 모형이다. 관람객은 움직이는 의자에 앉아 1960년의 고속도로와 자동차 도시를 내려다보았다. 유선형이 그린 미래는 이후 미국의 고속도로 계획에도 영향을 주었다.", q:"Norman Bel Geddes Futurama 1939"},
    {n:"8-11", t:"계획적 진부화", w:"할리 얼의 GM 디자인, 1959 캐딜락 엘도라도 테일핀", x:"GM의 할리 얼이 이끈 해마다의 모델 변경은 새로워 보이는 겉모양으로 새 차를 사고 싶게 만들었고, 테일핀은 그 상징이다. 아직 쓸 만한데도 낡아 보이게 만드는 이 전략은 소비사회 디자인의 쟁점이 되었고, 10장의 파파넥이 이를 비판한다.", q:"1959 Cadillac Eldorado tail fins"}
  ]}],
  kw:["1925 파리 박람회","기하학적 장식","장식의 모던 대 기능의 모던","대공황과 스타일링","유선형","산업디자이너라는 직업의 등장","계획적 진부화(일부러 빨리 낡게)","지그재그·햇살·계단 무늬","크롬·옻칠의 반짝이는 표면","둥근 모서리와 속도감 있는 가로줄"] },

{ id:"ch-9", no:"09", en:"Modernism", ko:"모더니즘과 국제주의 양식", period:"1920년대 후반 – 1960년대", span:[1927,1970],
  lead:"모더니즘은 장식을 걷어 내고 기능, 구조, 재료의 논리로 형태를 정하려는 태도다. 1932년 MoMA 전시가 ‘국제주의 양식’이라는 이름을 붙였고, 2차 세계대전 뒤 기업, 공공 시설, 가정으로 퍼져 20세기 중반의 표준이 되었다. 건축, 타이포그래피, 미국 그래픽, 가구, 울름 다섯 갈래로 나눠 본다.",
  parts:[
  { title:"건축: 국제주의 양식", items:[
    {n:"9-1", t:"빌라 사보아", w:"르 코르뷔지에, 도미노 시스템(1914), 빌라 사보아(1928~1931)", x:"1920년대의 건축에서 출발해 전후 그래픽·제품으로 모더니즘이 확산되는 과정을 살펴본다. 빌라 사보아는 철근 콘크리트 구조의 가능성을 ‘근대 건축의 5원칙’으로 구현한 대표 사례다.", q:"Villa Savoye Le Corbusier", list:["필로티","옥상정원","자유로운 평면","수평 띠창","자유로운 입면"]},
    {n:"9-2", t:"국제주의 양식이라는 이름", w:"바이센호프 주택단지(슈투트가르트, 1927), MoMA 〈근대 건축: 국제 전시〉(1932)", x:"1927년 공작연맹이 슈투트가르트에서 연 바이센호프 주택단지 전시는 미스가 총괄하고 르 코르뷔지에, 그로피우스 등이 흰 상자 같은 주택을 지었다. 5년 뒤 MoMA 전시가 이런 건축에 ‘국제주의 양식’이라는 이름을 붙이며 국경을 넘는 양식으로 정리했다.", q:"Weissenhof Estate Stuttgart 1927"},
    {n:"9-3", t:"시그램 빌딩", w:"미스 반 데어 로에·필립 존슨, 뉴욕, 1958", x:"미국으로 건너간 미스 반 데어 로에가 필립 존슨과 함께 뉴욕에 지은 위스키 회사 본사다. 청동색 철골과 유리벽으로 된 단순한 상자를 광장 뒤로 물려 세웠다. 사무용 고층 빌딩의 본보기가 되어, 전 세계 도심에 비슷한 유리 빌딩이 퍼졌다.", q:"Seagram Building Mies van der Rohe"}
  ]},
  { title:"타이포그래피: 뉴타이포그래피에서 스위스 스타일로", items:[
    {n:"9-4", t:"뉴타이포그래피", w:"얀 치홀트 『뉴타이포그래피』, 1928", x:"바우하우스 전시를 보고 영향을 받은 얀 치홀트는 『뉴타이포그래피』에서 비대칭 배치, 산세리프, 적극적인 여백을 체계화했다. 아방가르드와 바우하우스의 실험이 이 책으로 교과서가 되었고, 그의 영화 포스터에서도 그 원칙이 드러난다.", q:"Jan Tschichold Die neue Typographie poster"},
    {n:"9-5", t:"고전으로 돌아간 치홀트", w:"펭귄북스 표지 체계(1947~1949), 서체 사봉(1967)", x:"나치에게 체포되었다가 스위스로 망명한 치홀트는 뒤에 그 엄격함이 권위주의와 닮았다고 반성하며 고전적 대칭으로 돌아섰고, 영국 펭귄북스의 조판 규칙을 정비했다. 말년에는 고전 서체 사봉을 만들었다. 한 디자이너 안에서도 모더니즘이 절대 원칙은 아니었다.", q:"Tschichold Penguin books covers Sabon"},
    {n:"9-6", t:"헬베티카와 유니버스", w:"막스 미딩거·에두아르트 호프만(1957), 아드리안 프루티거(1957)", x:"1957년 스위스에서 발표된 두 서체는 전후의 체계적인 시각 커뮤니케이션을 대표한다. 헬베티카는 기업과 공공 사인을 채웠고, 유니버스는 굵기와 너비를 번호로 정리했다. 다만 ‘중립적인 서체’라는 말은 정해진 사실이라기보다 이 서체들이 내세운 목표에 가깝다.", q:"Helvetica Univers specimen 1957"},
    {n:"9-7", t:"요제프 뮐러브로크만", w:"취리히 톤할레 포스터(1950~1960년대), 〈데어 필름〉(1960)", x:"취리히의 요제프 뮐러브로크만은 그리드, 객관적 사진, 비대칭 산세리프로 ‘국제 타이포그래피 양식’을 대표한다. 톤할레 음악회 포스터는 음악의 리듬을 기하학 도형으로 옮겼다. 잡지 『노이에 그라피크』를 공동 창간했고 『그리드 시스템』을 썼다.", q:"Muller-Brockmann Tonhalle poster Der Film"},
    {n:"9-8", t:"에밀 루더", w:"포스터와 『타이포그래피』, 1967", x:"바젤 디자인학교의 에밀 루더는 활자의 리듬, 여백, 대비를 엄격하게 가르쳤다. 『타이포그래피』(1967)는 같은 산세리프로도 다양한 표정을 만드는 법을 보여 준 교과서다. 그가 바젤로 불러들인 젊은 교사 바인가르트가 10장에서 이 규칙을 깬다.", q:"Emil Ruder Typographie poster"}
  ]},
  { title:"미국: 뉴욕 스쿨과 기업 아이덴티티", items:[
    {n:"9-9", t:"폴 랜드", w:"IBM(1956, 줄무늬 1972), 〈아이·비·엠〉 포스터(1981), UPS(1961), ABC(1962)", x:"뉴욕의 폴 랜드는 유럽 모더니즘의 간결함에 위트와 상징을 결합했다. IBM, UPS, ABC처럼 기업의 성격을 기억하기 쉬운 표지로 압축하고 여러 매체에 일관되게 적용하며, 전후 기업 아이덴티티의 발전에 기여했다.", q:"Paul Rand IBM logo Eye Bee M poster"},
    {n:"9-10", t:"솔 바스", w:"〈현기증〉(1958), 〈살인의 해부〉(1959) 포스터와 타이틀 시퀀스", x:"솔 바스는 단순한 상징 하나로 영화 전체를 요약했다. 〈살인의 해부〉는 토막 난 몸의 실루엣, 〈현기증〉은 소용돌이 하나로 이야기를 예고한다. 이름만 나열하던 오프닝 타이틀을 움직이는 그래픽으로 바꿔 독립된 디자인 장르로 만들었다.", q:"Saul Bass Vertigo Anatomy of a Murder poster"},
    {n:"9-11", t:"글레이저와 비녤리", w:"밀턴 글레이저 〈I♥NY〉(1977), 마시모 비녤리 뉴욕 지하철 노선도(1972)", x:"밀턴 글레이저는 스위스식 엄격함 대신 일러스트와 손글씨를 섞는 길을 걸었고, 〈I♥NY〉로 도시 브랜딩의 고전을 남겼다. 밀라노 출신 비녤리는 실제 지리보다 노선의 연결 관계를 보여 주는 단순한 노선도로 정보디자인의 기준을 세웠다.", q:"Massimo Vignelli New York subway map 1972"}
  ]},
  { title:"미드센추리 가구와 생활용품", items:[
    {n:"9-12", t:"파이미오 체어", w:"알바 알토, 1931~1932", x:"핀란드의 알바 알토가 결핵 요양원을 위해 만든 의자다. 차가운 강철 파이프 대신 자작나무 합판을 휘어, 환자가 편히 숨 쉴 수 있는 각도로 등받이를 기울였다. 기능주의에 나무의 온기와 인간적인 배려를 더한 북유럽 모더니즘의 출발점이다.", q:"Alvar Aalto Paimio chair"},
    {n:"9-13", t:"찰스 & 레이 임스", w:"합판 의자 LCW(1945~1946), 라운지 체어 670(1956)", x:"찰스와 레이 임스 부부는 전쟁 중 해군의 합판 부목을 만들며 익힌 성형 기술을 가구에 적용했다. 몸에 맞게 휜 합판 의자 LCW는 대량생산 가능한 편안함을 보여 주었다. 가구뿐 아니라 영상, 전시, 장난감까지 아우른 디자이너 부부다.", q:"Eames lounge chair LCW plywood"},
    {n:"9-14", t:"튤립 체어", w:"에로 사리넨, 1956", x:"핀란드 출신 에로 사리넨은 의자 아래 어지러운 ‘다리의 숲’을 없애려 했다. 플라스틱 셸을 하나의 받침 위에 올린 튤립 체어로 바닥을 깨끗하게 비웠다. 다만 받침은 금속이라 하나의 재료로 된 의자라는 꿈은 판톤 체어에서야 이루어졌다.", q:"Saarinen Tulip chair", opt:true},
    {n:"9-15", t:"아르네 야콥센", w:"에그 체어(1958), 개미 의자(1952)", x:"덴마크의 아르네 야콥센은 코펜하겐 SAS 로열 호텔을 맡아 건물부터 가구, 조명, 식기까지 통합 디자인했다. 로비를 위해 만든 에그 체어는 알처럼 몸을 감싸 공공장소 안에 혼자만의 공간을 만든다. 합판 한 장으로 만든 개미 의자도 그의 작품이다.", q:"Arne Jacobsen Egg chair SAS Royal Hotel"},
    {n:"9-16", t:"덴마크 디자인", w:"한스 베그너 위시본 체어(1949), 포울 헨닝센 PH 아티초크 조명(1958)", x:"한스 베그너는 위시본 체어처럼 목공 기술을 현대적 가구 생산과 연결했고, 포울 헨닝센은 겹겹의 날개로 전구를 가린 PH 아티초크처럼 빛을 반사하고 가려서 눈부심을 줄였다. 재료·몸·일상의 쓰임에 대한 관심은 북유럽 모더니즘의 중요한 특징이다.", q:"Wegner Wishbone chair PH Artichoke lamp"},
    {n:"9-17", t:"카스틸리오니 형제", w:"아킬레·피에르 자코모 카스틸리오니, 메차드로·셀라(1957), RR126(1965)", x:"밀라노의 아킬레와 피에르 자코모 카스틸리오니 형제는 트랙터 좌석으로 의자 메차드로를, 자전거 안장으로 전화용 의자 셀라를 만들었다. 기성품을 재조합하는 이탈리아식 위트다. 브리온베가 RR126 오디오는 얼굴처럼 보이는 표정 있는 가전이다.", q:"Castiglioni Mezzadro Sella RR126"},
    {n:"9-18", t:"리처드 사퍼", w:"티지오 조명, 1972", x:"독일에서 태어나 밀라노에서 활동한 리처드 사퍼는 독일의 정밀함과 이탈리아의 조형 감각을 함께 가졌다. 티지오 조명은 팔 자체가 전류를 흘리는 균형추 구조라 전선 없이 자유롭게 움직인다. 1992년에는 IBM 씽크패드의 검은 상자를 디자인했다.", q:"Richard Sapper Tizio lamp"},
    {n:"9-19", t:"이탈리아 디자인", w:"지오 폰티 슈퍼레게라(1957), 마르첼로 니촐리 올리베티 레테라 22(1950)", x:"전후 재건기에 건축가 출신 디자이너와 기업이 협업하며 ‘이탈리아 디자인’이 하나의 브랜드가 되었다. 『도무스』를 창간한 지오 폰티를 중심으로 마르코 차누소, 비코 마지스트레티, 브루노 무나리, 단테 자코사, 그리고 앞서 본 카스틸리오니와 자퍼가 이 시기를 이끌었다.", q:"Gio Ponti Superleggera chair Olivetti Lettera 22", opt:true}
  ]},
  { title:"울름 조형대학과 브라운", items:[
    {n:"9-20", t:"울름 조형대학", w:"1953~1968, 막스 빌·오틀 아이허", x:"1953년 잉게 숄, 오틀 아이허, 막스 빌이 세운 울름 조형대학은 바우하우스의 유산을 이어받으면서 디자인을 과학·산업·사회와 연결했다. 막스 빌 이후 토마스 말도나도 등을 중심으로 체계적인 방법론을 발전시켰고, 기업·공공 영역의 시스템 설계로 확장했다.", q:"HfG Ulm building Max Bill"},
    {n:"9-21", t:"브라운", w:"SK4(디터 람스·한스 구겔로, 1956), T3 포켓 라디오(1958), ET66 계산기(1987)", x:"브라운은 울름 교수진과 협업해 제품의 외관을 정돈했다. 디터 람스와 한스 구겔로의 SK4는 투명 덮개와 정돈된 조작부로 ‘백설공주의 관’이라는 별명을 얻었다. 장식 없이 조용한 이 제품 언어는 11장의 애플 디자인까지 이어진다.", q:"Braun SK4 Dieter Rams T3"},
    {n:"9-22", t:"좋은 디자인의 10가지 원칙", w:"디터 람스, 1970년대 후반", x:"람스는 유용성·이해 가능성·정직함·환경에 대한 책임을 좋은 디자인의 기준으로 제시했다. 마지막 원칙은 ‘가능한 한 적게 디자인한다’이며, ‘적게, 그러나 더 좋게’는 그 태도를 요약한다.", noPlate:true, list:["좋은 디자인은 혁신적이다","제품을 유용하게 만든다","아름답다","제품을 이해하기 쉽게 만든다","눈에 띄려 하지 않는다","정직하다","오래 간다","마지막 디테일까지 철저하다","환경을 생각한다","가능한 한 적게 디자인한다"]},
    {n:"9-23", t:"올림픽 픽토그램", w:"1964 도쿄 올림픽(가쓰미 마사루 총괄), 1972 뮌헨 올림픽(오틀 아이허)", x:"도쿄와 뮌헨 올림픽은 경기 종목과 시설 안내를 일관된 그림 문자로 정리했고, 뮌헨에서는 울름 출신 오틀 아이허가 엄격한 그리드로 이를 완성했다. 말이 달라도 읽히는 공공 정보디자인의 본보기지만, 그림 문자도 문화에 따라 다르게 읽힐 수 있다.", q:"Otl Aicher Munich 1972 pictograms"}
  ]}],
  kw:["장식 없애기","기능·구조·재료 중심","국제주의 양식","그리드와 산세리프","CI","휘어 만든 합판","북유럽의 온기, 이탈리아의 위트","울름의 체계적 디자인","비대칭 배치와 넉넉한 여백","단순한 도형 로고"] },

{ id:"ch-10", no:"10", en:"Postmodernism", ko:"포스트모더니즘", period:"1960년대 – 1990년대", span:[1960,1999],
  lead:"1960년대부터 어디서나 비슷해진 모더니즘과 ‘좋은 디자인’의 딱딱함에 대한 반발이 커졌다. 팝과 래디컬 디자인이 소비문화와 쓰고 버리는 즐거움을 받아들였고, 1970~80년대 포스트모더니즘은 옛 양식 인용, 장식, 유머, 상징을 되살렸다. 1980년대 후반에는 해체주의와 매킨토시가 형태와 지면의 질서를 다시 흔들었다.",
  parts:[
  { title:"전조: 팝과 래디컬 디자인", items:[
    {n:"10-1", t:"팝아트", w:"앤디 워홀 〈캠벨 수프 캔〉, 1962", x:"1960년대 이후에는 모더니즘이 내세운 하나의 정답에 대한 비판이 커졌다. 팝아트는 소비문화의 이미지로 예술과 일상의 경계를 흔들었다. 이어질 래디컬·포스트모던 디자인을 이해하는 배경이며, 두 흐름이 같은 사조는 아니다.", q:"Andy Warhol Campbell's Soup Cans 1962"},
    {n:"10-2", t:"판톤 체어", w:"베르너 판톤, 1960 디자인, 1967 생산", x:"덴마크의 베르너 판톤은 다리와 좌석, 등받이가 하나로 이어진 의자를 꿈꿨다. 판톤 체어는 플라스틱 한 덩어리를 틀에 부어 만든 일체형 의자로, 뒷다리 없이도 버티며 사리넨이 이루지 못한 단일 재료의 의자를 실현했다. 원색과 곡선이 1960년대의 낙관을 보여 준다.", q:"Verner Panton chair"},
    {n:"10-3", t:"플라스틱과 새로운 생활", w:"UP5 ‘라 마마’(1969), 조 콜롬보의 보비 트롤리(1970)", x:"압축 포장을 풀면 부풀어 오르는 페셰의 UP5는 몸을 감싸는 의자와 묶인 공 형태로 여성의 사회적 속박을 은유했다. 콜롬보의 보비 트롤리는 이동식 수납으로 유연한 생활을 제안했다. 같은 소재도 비판과 실용이라는 다른 방향으로 쓰였다.", q:"Gaetano Pesce UP5 La Mamma"},
    {n:"10-4", t:"래디컬 디자인", w:"아키줌 〈노-스톱 시티〉(1969), 수퍼스튜디오 〈연속 기념비〉(1969)", x:"1960년대 후반 피렌체의 젊은 건축가 그룹 아키줌과 수퍼스튜디오는 짓지 않는 건축을 했다. 끝없는 격자 구조물이 도시와 자연을 뒤덮는 도면과 콜라주로 모더니즘 도시와 소비사회를 풍자했다. 이탈리아가 모더니즘 비판의 진원지가 되었다.", q:"Superstudio Continuous Monument"},
    {n:"10-5", t:"빅터 파파넥", w:"『인간을 위한 디자인』, 1971", x:"“산업디자인보다 해로운 직업은 있지만 그리 많지 않다.” 파파넥은 소비를 부추기는 디자인을 비판하고, 장애·빈곤·환경 등 실제 삶의 문제를 다룰 것을 요구했다. 포스트모던 양식과는 별개로, 같은 시대에 제기된 디자인의 사회적 책임을 보여 준다.", q:"Victor Papanek Design for the Real World"}
  ]},
  { title:"포스트모더니즘", items:[
    {n:"10-6", t:"로버트 벤투리", w:"『건축의 복합성과 대립성』(1966), 바나 벤투리 하우스(1964)", x:"필라델피아의 건축가 로버트 벤투리는 미스의 “적을수록 많다”를 비틀어 “적을수록 지루하다”고 했다. 어머니를 위해 지은 바나 벤투리 하우스는 가운데가 갈라진 삼각 지붕과 장식 아치로 ‘집’의 상징을 일부러 드러냈다. 모순과 일상의 상징을 긍정했다.", q:"Vanna Venturi House"},
    {n:"10-7", t:"장식의 귀환", w:"마이클 그레이브스 포틀랜드 빌딩(1982)과 알레시 주전자 9093(1985), 필립 존슨 AT&T 빌딩(1984)", x:"벤투리 이후 건축가들은 고전 건축의 기둥, 삼각 지붕, 아치를 장난스럽게 인용했다. 필립 존슨의 AT&T 빌딩은 마천루 꼭대기에 가구 장식 같은 지붕을 얹었고, 마이클 그레이브스는 새 모양 피리를 단 알레시 주전자로 같은 언어를 생활용품에 옮겼다.", q:"Michael Graves Alessi kettle 9093"},
    {n:"10-8", t:"알레산드로 멘디니", w:"프루스트 의자(1978), 안나 G 와인 오프너(1994)", x:"멘디니는 역사적 형태의 의자에 점묘 무늬를 입히는 ‘재디자인’으로 새로움과 독창성의 의미를 질문했다. 스튜디오 알키미아의 실험은 물건을 기능뿐 아니라 기억·장식·문화적 의미로 읽는 방향을 보여 준다. 뒤에는 알레시와 사람을 닮은 상품도 만들었다.", q:"Alessandro Mendini Proust chair"},
    {n:"10-9", t:"멤피스 그룹", w:"밀라노, 1981", x:"1981년 밀라노에서 에토레 소트사스를 중심으로 결성했고, 이름은 모임 날 흘러나온 밥 딜런의 노래에서 따왔다. 싸구려로 여겨진 플라스틱 라미네이트, 강렬한 원색, 테라초 무늬를 일부러 섞었다. 첫 전시가 큰 화제를 모으며 1980년대의 상징이 되었다.", q:"Memphis Group Milano 1981"},
    {n:"10-10", t:"소트사스와 샤이어", w:"에토레 소트사스 칼턴 책장(1981), 피터 샤이어 벨에어 체어(1982)", x:"소트사스의 칼턴 책장과 샤이어의 벨에어 체어는 기하학적 형태와 강렬한 색을 조합해 가구가 하나의 시각적 기호로 읽히게 했다. 기능을 없애기보다, 기능만으로는 설명되지 않는 상징과 감정의 가치를 전면에 내세웠다.", q:"Sottsass Carlton bookcase Peter Shire Bel Air chair"},
    {n:"10-11", t:"필리프 스타르크", w:"주시 살리프(1990), 〈건스〉 조명(2005)", x:"프랑스의 필리프 스타르크는 디자이너 자체가 브랜드가 된 시대를 대표한다. 알레시의 주시 살리프는 거미 같은 레몬즙 짜개로, 쓰기 불편하다는 비판에도 ‘대화를 시작하는 물건’으로 아이콘이 되었다. 물건이 기능보다 이야기로 팔리기 시작했다.", q:"Philippe Starck Juicy Salif"},
    {n:"10-12", t:"볼프강 바인가르트", w:"포스터, 1970~1980년대", x:"바젤 디자인학교의 볼프강 바인가르트는 스승 세대의 스위스 스타일 규칙을 깨뜨린 ‘스위스 뉴웨이브’를 열었다. 겹친 이미지, 기울인 글줄, 크게 키운 인쇄 망점을 썼고, 그의 학생 에이프릴 그라이먼 등을 통해 미국으로 퍼졌다.", q:"Wolfgang Weingart poster"},
    {n:"10-13", t:"잡지라는 실험장", w:"네빌 브로디 『더 페이스』(1981~1986), 『에미그레』(1984~, 루디 밴더란스·주자나 리츠코)", x:"1980년대 잡지 지면은 포스트모던 그래픽의 실험장이었다. 영국의 네빌 브로디는 『더 페이스』에서 지면마다 서체와 구성을 바꿨고, 『에미그레』는 초기 매킨토시로 만든 비트맵 서체를 직접 팔며 디지털 서체의 시대를 열었다.", q:"Emigre magazine Zuzana Licko"},
    {n:"10-14", t:"퐁피두 센터", w:"렌초 피아노·리처드 로저스, 파리, 1977", x:"렌초 피아노와 리처드 로저스가 설계한 파리의 문화 센터다. 배관, 공기 관, 에스컬레이터를 밖으로 꺼내 냉난방은 파랑, 수도는 초록, 전기는 노랑, 사람의 이동은 빨강으로 칠했다. 장식을 인용하기보다 기술을 드러낸 ‘하이테크 건축’이다.", q:"Centre Pompidou Piano Rogers"}
  ]},
  { title:"해체주의와 디지털 전환", items:[
    {n:"10-15", t:"매킨토시", w:"애플, 1984, 수전 케어의 아이콘과 비트맵 서체", x:"매킨토시의 그림으로 조작하는 화면과 케어의 아이콘은 컴퓨터를 친숙하게 만들었다. 이후 편집 소프트웨어와 레이저 프린터가 결합하면서 컴퓨터로 인쇄물을 만드는 데스크톱 출판이 퍼졌다. 디자이너가 화면에서 직접 활자와 이미지를 다루게 된 것이다.", q:"Susan Kare Macintosh icons 1984"},
    {n:"10-16", t:"해체주의 건축", w:"MoMA 〈해체주의 건축〉전(1988), 자하 하디드 비트라 소방서(1993)", x:"1988년 MoMA 〈해체주의 건축〉전은 기울고 깨진 형태로 안정과 조화의 원칙을 해체한 건축가들을 소개했다. 자하 하디드, 프랭크 게리, 다니엘 리베스킨트, 렘 콜하스 등이다. 하디드의 비트라 소방서는 날카로운 콘크리트 면이 서로 부딪히듯 겹친다.", q:"Zaha Hadid Vitra Fire Station"},
    {n:"10-17", t:"구겐하임 빌바오", w:"프랭크 게리, 1997", x:"프랭크 게리는 항공산업의 설계 소프트웨어로 손 모형의 복잡한 곡면을 계산해 티타늄으로 구현했다. 도시 이미지와 관광 활성화에 기여했지만, ‘빌바오 효과’는 미술관뿐 아니라 교통·환경 정비 등 장기적인 도시 재생과 함께 이해해야 한다.", q:"Guggenheim Bilbao Frank Gehry"},
    {n:"10-18", t:"크랜브룩", w:"캐서린 매코이 포스터, 1989", x:"미국 크랜브룩 미술학교의 캐서린 매코이와 학생들은 해체주의 철학을 그래픽에 적용했다. 텍스트를 겹치고 흩어 독자가 직접 의미를 엮게 하는 ‘읽는 이미지’를 실험했다. 정보를 투명하게 전달해야 한다는 스위스 스타일의 원칙에 맞선 것이다.", q:"Katherine McCoy Cranbrook poster 1989"},
    {n:"10-19", t:"데이비드 카슨", w:"『레이 건』, 1992~1995", x:"음악 잡지 『레이 건』의 아트 디렉터 데이비드 카슨은 읽기 어려움마저 표현으로 삼은 ‘그런지 타이포그래피’를 선보였다. 지루한 인터뷰 기사를 기호 서체로 조판한 일화가 유명하다. 매킨토시 이후 규칙이 흔들린 그래픽의 극단을 보여 준다.", q:"David Carson Ray Gun magazine"}
  ]}],
  kw:["팝(소비·쓰고 버리기)","래디컬(풍자)","파파넥(사회적 책임)","Less is a bore(적은 것은 지루하다)","옛 양식 빌려 오기와 장식","멤피스","하이테크(구조·설비 드러내기)","해체주의(쪼개고 비튼 형태)","컴퓨터 편집 디자인","튀는 원색과 무늬","유머와 과장","겹치고 기울인 글자"] },

{ id:"ch-11", no:"11", en:"Contemporary", ko:"컨템포러리", period:"1990년대 – 현재", span:[1990,2026],
  lead:"1990년대 이후 디자인은 하나의 양식으로 묶이지 않는다. 본질을 좇는 미니멀리즘, 개념과 이야기를 앞세운 실험, 디지털 도구가 만든 유기적 형태가 공존하고, 디자인의 대상은 물건에서 경험, 서비스, 시스템, 사회 문제로 넓어졌다.",
  parts:[
  { title:"본질과 미니멀리즘", items:[

function kwNeeds(x) { return /[가-힣]/.test(x) && /[^\s가-힣ㄱ-ㆎA-Za-z0-9]/.test(x); }
function keepWords(root) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: t => {
    const p = t.parentElement;
    if (!p || p.closest("script, style, .kw")) return NodeFilter.FILTER_REJECT;
    return kwNeeds(t.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
  } });
  const nodes = []; let t;
  while ((t = w.nextNode())) nodes.push(t);
  nodes.forEach(t => {
    const frag = document.createDocumentFragment();
    t.data.split(/(\s+)/).forEach(x => {
      if (!x) return;
      if (kwNeeds(x)) { const s = document.createElement("span"); s.className = "kw"; s.textContent = x; frag.appendChild(s); }
      else frag.appendChild(document.createTextNode(x));
    });
    t.replaceWith(frag);
  });
}

// 피그마와 같은 규칙: 한 트랙 안의 일반 카드는 가장 긴 일반 카드 높이로 맞추고, 연표·목록이 있는 카드만 제 높이를 쓴다
function fitTrack(track) {
  const slides = Array.from(track.children);
  slides.forEach(s => { s.style.minHeight = ""; });
  const std = Math.max(0, ...slides.filter(s => !s.querySelector(".events, .steps")).map(s => s.offsetHeight));
  if (std) slides.forEach(s => { s.style.minHeight = std + "px"; });
}
function fitTracks() { document.querySelectorAll("#view .track").forEach(fitTrack); }
let fitRaf = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitTracks); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTracks);
function initTracks(root) {
  root.querySelectorAll(".track").forEach(track => {
    fitTrack(track);
    const slides = Array.from(track.children);
    const ctrl = track.nextElementSibling;
    const count = ctrl.querySelector(".t-count");
    const btns = ctrl.querySelectorAll(".t-btn");
    let cur = -1, raf = 0;
    const update = () => {
      const mid = track.scrollLeft + track.clientWidth / 2;
      let best = 0, bd = Infinity;
      slides.forEach((s, k) => { const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = k; } });
      if (best === cur) return;
      cur = best;
      slides.forEach((s, k) => s.classList.toggle("is-active", k === best));
      count.textContent = (best + 1) + " / " + slides.length;
      btns[0].disabled = best === 0;
      btns[1].disabled = best === slides.length - 1;
    };
    const goTo = k => { const s = slides[Math.max(0, Math.min(slides.length - 1, k))]; track.scrollTo({ left: s.offsetLeft + s.offsetWidth / 2 - track.clientWidth / 2, behavior: "smooth" }); };
    track.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; update(); }); }, { passive: true });
    btns.forEach(b => b.addEventListener("click", () => goTo(cur + Number(b.dataset.dir))));
    track.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); goTo(cur + (e.key === "ArrowRight" ? 1 : -1)); } });
    update();
  });
}

  h += '</tbody></table></div></section>';
  const linkTable = (n, title, rows) => '<section class="part" data-part="' + n + '"><h2>' + title + '</h2><div class="table-wrap"><table class="link-table"><thead><tr><th>이름</th><th>사이트</th></tr></thead><tbody>' + rows.map(r => '<tr><td>' + r[0] + '</td><td><a href="' + r[1] + '" target="_blank" rel="noopener">' + r[1].replace(/^https?:\/\//, "").replace(/\/$/, "") + '</a></td></tr>').join("") + '</tbody></table></div></section>';
  h += linkTable(2, "디자인 관련 학회 사이트", APPX.sites);
  h += linkTable(3, "디자인 조형 언어 텍스트 참고", APPX.refs);
  return h + pager([CH[CH.length - 1].id, CH[CH.length - 1].no + " " + CH[CH.length - 1].ko], ["home", "표지로"]) + '</div>';
}

let current = null;
function setArrow(el, target, label) {
  if (target) { el.setAttribute("href", "#" + target); el.removeAttribute("aria-disabled"); el.removeAttribute("tabindex"); el.setAttribute("aria-label", label); }
  else { el.removeAttribute("href"); el.setAttribute("aria-disabled", "true"); el.setAttribute("tabindex", "-1"); }
}
function scrollToPart(sec) {
  const el = document.querySelector('#view [data-part="' + sec + '"]');
  if (!el) return;
  el.scrollIntoView({ block: "start" });
  const h2 = el.querySelector("h2");
  if (h2) { h2.setAttribute("tabindex", "-1"); h2.focus({ preventScroll: true }); }
}
function show() {
  const raw = location.hash.replace(/^#/, "");
  const m = raw.match(/^(.+?)-s(\d+)$/);
  const base = m ? m[1] : raw;
  const v = VIEWS.includes(base) ? base : "home";
  const sec = m && VIEWS.includes(base) ? m[2] : null;
  closeToc(false);
  closeLb(false);
  if (v === current) {
    if (sec) scrollToPart(sec); else window.scrollTo(0, 0);
    return;
  }
  const k = VIEWS.indexOf(v);
  const i = CH.findIndex(c => c.id === v);
  const main = document.getElementById("view");
  const p = PAL[v];
  const bs = document.body.style;
  bs.setProperty("--c", colorOf(v));
  ["--g0", "--g1", "--g2", "--g3", "--g4"].forEach((name, j) => bs.setProperty(name, p.at(j)));
  if (v === "home") { main.innerHTML = renderHome(); keepWords(main); }
  else if (v === "appendix") { main.innerHTML = renderAppendix(); keepWords(main); }
  else { main.innerHTML = renderChapter(CH[i], i); keepWords(main); initTracks(main); }
  document.getElementById("pillLabel").textContent = enOf(v);
  document.getElementById("progress").style.width = ((k + 1) / VIEWS.length * 100).toFixed(2) + "%";
  const pv = k > 0 ? VIEWS.at(k - 1) : null, nx = k < VIEWS.length - 1 ? VIEWS.at(k + 1) : null;
  setArrow(document.getElementById("prevBtn"), pv, pv ? "이전 페이지: " + enOf(pv) : "");
  setArrow(document.getElementById("nextBtn"), nx, nx ? "다음 페이지: " + enOf(nx) : "");
  document.title = (i >= 0 ? CH[i].ko + " | " : v === "appendix" ? "부록 | " : "") + "디자인사";
  document.querySelectorAll("#tocList a").forEach(a => { a.getAttribute("href") === "#" + v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
  if (sec) {
    requestAnimationFrame(() => scrollToPart(sec));
  } else if (current !== null) {
    window.scrollTo(0, 0);
    const h1 = main.querySelector("h1");
    if (h1) h1.focus({ preventScroll: true });
  }
  current = v;
}

function go(step) {
  const k = VIEWS.indexOf(current) + step;
  if (k >= 0 && k < VIEWS.length) location.hash = VIEWS.at(k);
}

buildToc();
const toc = document.getElementById("toc"), tocBtn = document.getElementById("tocBtn");
function openToc() {
  toc.classList.add("open");
  document.documentElement.classList.add("toc-lock");
  tocBtn.setAttribute("aria-expanded", "true");
  document.getElementById("view").inert = true;
  toc.scrollTop = 0;
  const cur = toc.querySelector('a[aria-current="page"]');
  if (cur) { cur.scrollIntoView({ block: "center" }); cur.focus({ preventScroll: true }); }
}
function closeToc(restore) {
  if (!toc.classList.contains("open")) return;
  toc.classList.remove("open");
  document.documentElement.classList.remove("toc-lock");
  tocBtn.setAttribute("aria-expanded", "false");
  document.getElementById("view").inert = false;
  if (restore) tocBtn.focus();
}
tocBtn.addEventListener("click", () => toc.classList.contains("open") ? closeToc(true) : openToc());
toc.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (a) {
    closeToc(false);
    if (a.getAttribute("href") === location.hash) { e.preventDefault(); show(); }
  } else if (!e.target.closest(".toc-card")) closeToc(true);
});
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbCap = document.getElementById("lbCap"), lbCount = document.getElementById("lbCount");
const lbPrev = document.getElementById("lbPrev"), lbNext = document.getElementById("lbNext"), lbClose = document.getElementById("lbClose");
let lbList = [], lbIdx = 0, lbFrom = null;
const lbStage = document.getElementById("lbStage");
function lbFit() {
  if (!lbImg.naturalWidth) return;
  const st = getComputedStyle(lbStage);
  const aw = lbStage.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
  const ah = lbStage.clientHeight - parseFloat(st.paddingTop) - parseFloat(st.paddingBottom);
  const s = Math.min(aw / lbImg.naturalWidth, ah / lbImg.naturalHeight);
  lbImg.style.width = Math.round(lbImg.naturalWidth * s) + "px";
  lbImg.style.height = Math.round(lbImg.naturalHeight * s) + "px";
}
lbImg.addEventListener("load", lbFit);
window.addEventListener("resize", () => { if (lb.classList.contains("open")) lbFit(); });
function lbShow(k) {
  if (!lbList.length) return;
  lbIdx = Math.max(0, Math.min(lbList.length - 1, k));
  const n = lbList[lbIdx], it = ITEMS[n];
  const src = "img/" + n + ".webp";
  if (lbImg.getAttribute("src") !== src) lbImg.setAttribute("src", src);
  else lbFit();
  lbImg.alt = plain(it.t) + (it.w ? " — " + plain(it.w) : "");
  lbCap.innerHTML = '<b><span>' + n + '</span>' + it.t + '</b>' + (it.w ? it.w : "");
  keepWords(lbCap);
  lbCount.textContent = (lbIdx + 1) + " / " + lbList.length;
  lbPrev.disabled = lbIdx === 0;
  lbNext.disabled = lbIdx === lbList.length - 1;
  [lbIdx - 1, lbIdx + 1].forEach(j => { if (j >= 0 && j < lbList.length) { const pre = new Image(); pre.src = "img/" + lbList[j] + ".webp"; } });
}
function openLb(n, from) {
  lbList = Array.from(document.querySelectorAll("#view [data-zoom]")).map(b => b.dataset.zoom);
  lbFrom = from;
  lbShow(Math.max(0, lbList.indexOf(n)));
  lb.classList.add("open");
  lb.setAttribute("aria-hidden", "false");
  document.documentElement.classList.add("lb-lock");
  document.getElementById("view").inert = true;
  document.querySelector(".nav").inert = true;
  lbClose.focus({ preventScroll: true });
}
function closeLb(restore) {
  if (!lb.classList.contains("open")) return;
  lb.classList.remove("open");
  lb.setAttribute("aria-hidden", "true");
  document.documentElement.classList.remove("lb-lock");
  document.getElementById("view").inert = false;
  document.querySelector(".nav").inert = false;
  if (restore === false) return;
  const b = document.querySelector('#view [data-zoom="' + lbList[lbIdx] + '"]') || lbFrom;
  if (!b) return;
  const sl = b.closest(".slide");
  if (sl) { const tr = sl.parentElement; tr.scrollTo({ left: sl.offsetLeft + sl.offsetWidth / 2 - tr.clientWidth / 2 }); }
  b.focus({ preventScroll: b === lbFrom });
}
document.getElementById("view").addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]");
  if (!z) return;
  const sl = z.closest(".slide");
  if (sl && !sl.classList.contains("is-active")) { const tr = sl.parentElement; tr.scrollTo({ left: sl.offsetLeft + sl.offsetWidth / 2 - tr.clientWidth / 2, behavior: "smooth" }); return; }
  openLb(z.dataset.zoom, z);
});
lbPrev.addEventListener("click", () => lbShow(lbIdx - 1));
lbNext.addEventListener("click", () => lbShow(lbIdx + 1));
lbClose.addEventListener("click", () => closeLb(true));
lb.addEventListener("click", e => { if (e.target === lb || e.target.id === "lbStage" || e.target.classList.contains("lb-bar")) closeLb(true); });
let lbTouch = null;
lb.addEventListener("touchstart", e => { lbTouch = e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (!lbTouch) return;
  const dx = e.changedTouches[0].clientX - lbTouch[0], dy = e.changedTouches[0].clientY - lbTouch[1];
  lbTouch = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbShow(lbIdx + (dx < 0 ? 1 : -1));
}, { passive: true });
document.addEventListener("keydown", e => {
  if (lb.classList.contains("open")) {
    if (e.key === "Escape") { e.preventDefault(); closeLb(true); }
    else if (e.key === "ArrowRight") { e.preventDefault(); lbShow(lbIdx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); lbShow(lbIdx - 1); }
    else if (e.key === "Tab") {
      const f = [lbPrev, lbNext, lbClose].filter(x => !x.disabled);
      const k = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(k + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
    return;
  }
  if (e.key === "Escape" && toc.classList.contains("open")) { closeToc(true); return; }
  if (toc.classList.contains("open") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest(".track")) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});
document.getElementById("view").addEventListener("click", e => {
  const b = e.target.closest(".view-toggle button");
  if (!b || b.dataset.mode === VIEW_MODE) return;
  VIEW_MODE = b.dataset.mode;
  try { localStorage.setItem("dh-view", VIEW_MODE); } catch (err) {}
  const i = CH.findIndex(c => c.id === current);
  const box = document.getElementById("bodyParts");
  if (i < 0 || !box) return;
  box.className = "body-parts mode-" + VIEW_MODE;
  box.innerHTML = partsHTML(CH[i]);
  keepWords(box);
  document.querySelectorAll(".view-toggle button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.mode === VIEW_MODE)));
  initTracks(box);
});
const onScroll = () => { const c = document.querySelector(".cover"); document.body.classList.toggle("inbody", !!c && window.scrollY > c.offsetHeight - 90); };
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("hashchange", () => { show(); onScroll(); });
show();
</script>
</body>
